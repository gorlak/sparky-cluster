---
# Sparky Cluster — two-node NVIDIA DGX Spark (GB10). Ansible runs as `deploy` (see bootstrap-deploy.sh).
#   sparky = control node — local connection (deploy invokes ansible here); also
#            where head-only services live (Open WebUI, Caddy, control panel,
#            Prometheus, Grafana).
#   snoopy = compute node — reached over SSH as deploy@10.0.200.13.
#
# The `head`/`worker` groups target those host-level services. vLLM serving
# placement is NOT decided here — it comes from each profile's serving_topology,
# and per-engine rank / API host / master_addr are computed from the node list
# (see docs/serving-topology.md). Per-host `vllm_host_ip` feeds VLLM_HOST_IP and
# the engines' master_addr. All interconnect (SSH + NCCL) uses ConnectX-7.
all:
  children:
    head:
      hosts:
        sparky:
          ansible_connection: local
          vllm_host_ip: 10.0.200.12
    worker:
      hosts:
        snoopy:
          ansible_host: 10.0.200.13
          ansible_user: deploy
          ansible_ssh_private_key_file: /home/deploy/.ssh/id_ed25519
          vllm_host_ip: 10.0.200.13
