---
# Converge the FLEET to the allowlist (ADR-0018). No profile argument — `deploy`
# means *deploy the fleet*, not *deploy one profile*:
#
#   ./sparky.sh deploy            # provision everything the allowlist declares
#   ./sparky.sh deploy --evict    # …and reclaim the disk of de-allowlisted weights
#   ./sparky.sh check             # dry-run (--check --diff); makes nothing
#
# This playbook *sets the boundary of what may run*. It is **selection-neutral**: it
# preserves whatever is currently active if that profile is still allowlisted, and
# otherwise falls to `empty` — it never auto-promotes a model. Choosing what serves
# is `./sparky.sh activate <profile>`, which needs no root and touches none of this.
#
# Ansible is the `deploy` engine only — human-initiated and password-gated. It is
# never the activation engine, and no web API can reach it.

- name: The fleet definition — every profile is the allowlist (all nodes)
  hosts: all
  gather_facts: true
  roles:
    - role: fleet
      tags: [always]

# Before anything touches weights or units: settle what stays selected. A profile
# that left the allowlist is stopped here, so the store can be converged safely.
- name: Preserve or fall back the current selection (sparky)
  hosts: head
  roles:
    - role: selection
      tags: [always]

- name: Prerequisites, weights, and images (all nodes)
  hosts: all
  roles:
    - common
    # Convergent, per-node: mirrors the models each node runs, plans (and with
    # --evict, deletes) the ones no profile keeps any more.
    - role: model
      tags: [model]
    # Container images (ADR-0013): every image any profile may select, on every node.
    # Left to Docker's GC on removal — shared base layers make convergent image
    # deletion unsafe.
    - role: images
      tags: [images]

# The serving surface: one template unit + one env file per allowlisted engine.
# Installs, never starts.
- name: vLLM engine surface (all nodes)
  hosts: all
  roles:
    - role: vllm
      tags: [vllm]

# The activation boundary: the fixed reconciler and its two bounded triggers.
- name: Activation reconciler and its grants (all nodes)
  hosts: all
  roles:
    - role: activate
      tags: [activate]

# The harness as a deployed component (ADR-0021): the venv a detached suite run
# executes, and the writable state it records into. After `activate`, because it asserts
# properties of the identity that role creates.
- name: The harness, installed and runnable (sparky)
  hosts: head
  roles:
    - role: harness
      tags: [harness]

- name: Open WebUI front-end (sparky)
  hosts: head
  roles:
    - role: open-webui
      tags: [webui]

- name: Control panel (sparky)
  hosts: head
  roles:
    - role: control-panel
      tags: [control-panel]

- name: Reverse proxy + landing page (sparky)
  hosts: head
  roles:
    - role: caddy
      tags: [proxy]

- name: Metrics exporters (all nodes)
  hosts: all
  roles:
    - role: exporters
      tags: [metrics]

- name: Prometheus (sparky)
  hosts: head
  roles:
    - role: prometheus
      tags: [metrics]

- name: Grafana (sparky)
  hosts: head
  roles:
    - role: grafana
      tags: [metrics]

# Last: record the fleet, then converge to the preserved selection without ever
# restarting a healthy engine.
- name: Record the fleet and converge the selection (sparky)
  hosts: head
  roles:
    - role: fleet-state
      tags: [always]
