---
# Bring the cluster to a profile's desired state.
#   make deploy PROFILE=step
#   (or: ansible-playbook site.yml -e @profiles/step.yml)
#
# Plays run in order so services come up cleanly: prerequisites + models on all
# nodes, then every vLLM engine in the profile's serving_topology is brought up
# across all nodes, then we wait for each engine's API, then the front-end.

- name: Prerequisites and model (all nodes)
  hosts: all
  roles:
    - common
    - role: model
      tags: [model]

- name: vLLM engines — configure and bring up (all nodes)
  hosts: all
  roles:
    - role: vllm
      tags: [vllm]

- name: vLLM engines — wait for APIs to report ready (all nodes)
  hosts: all
  tasks:
    - name: Wait for each engine's API where this host is the API node
      ansible.builtin.include_role:
        name: vllm
        tasks_from: wait
      tags: [vllm]

- name: Open WebUI front-end (sparky)
  hosts: head
  roles:
    - role: open-webui
      tags: [webui]
      when: enable_open_webui | default(true)

- name: Control panel (sparky)
  hosts: head
  roles:
    - role: control-panel
      tags: [control-panel]
      when: enable_control_panel | default(true)

- name: Reverse proxy + landing page (sparky)
  hosts: head
  roles:
    - role: caddy
      tags: [proxy]
      when: enable_reverse_proxy | default(true)

- name: Metrics exporters (all nodes)
  hosts: all
  roles:
    - role: exporters
      tags: [metrics]
      when: enable_metrics | default(true)

- name: Prometheus (sparky)
  hosts: head
  roles:
    - role: prometheus
      tags: [metrics]
      when: enable_metrics | default(true)

- name: Grafana (sparky)
  hosts: head
  roles:
    - role: grafana
      tags: [metrics]
      when: enable_metrics | default(true)
