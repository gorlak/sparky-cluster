---
# Bring the cluster to a profile's desired state.
#   ./sparky.sh deploy step-3.5-fp8
#   (or: ansible-playbook site.yml -e @profiles/step-3.5-fp8.yml)
#
# Plays run in order so services come up cleanly: prerequisites + models on all
# nodes, then every vLLM engine in the profile's serving_topology is brought up
# across all nodes, then we wait for each engine's API, then Ollama engines (pull
# their models), then the front-end (Open WebUI auto-wires to both via the spec).

- name: Prerequisites and model (all nodes)
  hosts: all
  roles:
    - common
    - role: model
      tags: [model]
    # Container images (ADR-0013): guarantee every image a profile may select is
    # present on every node — before the vllm play docker-runs any unit.
    - role: images
      tags: [images]

- name: vLLM engines — configure and bring up (all nodes)
  hosts: all
  roles:
    - role: vllm
      tags: [vllm]

- name: vLLM engines — wait for APIs to report ready (all nodes)
  hosts: all
  tasks:
    - name: Wait for each engine's API where this host is the API node
      ansible.builtin.include_role:
        name: vllm
        tasks_from: wait
      tags: [vllm]

- name: Ollama engines — configure, bring up, pull models (all nodes)
  hosts: all
  roles:
    - role: ollama
      tags: [ollama]

- name: Open WebUI front-end (sparky)
  hosts: head
  roles:
    - role: open-webui
      tags: [webui]
      when: enable_open_webui | default(true)

- name: Control panel (sparky)
  hosts: head
  roles:
    - role: control-panel
      tags: [control-panel]
      when: enable_control_panel | default(true)

- name: Reverse proxy + landing page (sparky)
  hosts: head
  roles:
    - role: caddy
      tags: [proxy]
      when: enable_reverse_proxy | default(true)

- name: Metrics exporters (all nodes)
  hosts: all
  roles:
    - role: exporters
      tags: [metrics]
      when: enable_metrics | default(true)

- name: Prometheus (sparky)
  hosts: head
  roles:
    - role: prometheus
      tags: [metrics]
      when: enable_metrics | default(true)

- name: Grafana (sparky)
  hosts: head
  roles:
    - role: grafana
      tags: [metrics]
      when: enable_metrics | default(true)

# Quality gate (ADR-0012): probe the in-flight engines for readiness, the tool-call
# shape Open WebUI sends, and multiturn output quality — BEFORE topology-state, so a
# corrupt engine fails the deploy before it's recorded as the live topology.
- name: Post-deploy smoke gate (sparky)
  hosts: head
  roles:
    - role: smoke
      tags: [smoke]

# Record what was just deployed so the control panel (and "which profile is live?")
# can read it. Last, so it reflects a fully brought-up topology.
- name: Record deployed topology (state file)
  hosts: head
  roles:
    - role: topology-state
      tags: [topology, control-panel]
