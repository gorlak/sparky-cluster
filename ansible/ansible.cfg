[defaults]
inventory          = inventory.yml
roles_path         = roles
host_key_checking  = False
interpreter_python = auto_silent
# Ansible is invoked as the deploy user (sudo -u deploy ansible-playbook …).
# sparky is a local connection; snoopy is reached over SSH as deploy.
remote_user        = deploy

[privilege_escalation]
# deploy has NOPASSWD: ALL on both nodes, so become needs no password.
become             = True
become_method      = sudo
become_user        = root
become_ask_pass    = False

[ssh_connection]
pipelining         = True

[colors]
# "FAILED - RETRYING" (emitted during `until`/retries loops — e.g. the API-wait)
# uses COLOR_DEBUG, which defaults to `dark gray` and is near-illegible on a dark
# terminal. These are normal polling, not real failures — recolor to something
# readable and calm rather than alarming.
debug = bright blue
