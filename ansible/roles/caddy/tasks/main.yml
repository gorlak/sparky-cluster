---
# Caddy reverse proxy on :80 — serves the landing page at the catch-all host and
# proxies chat.{{ web_domain }} to Open WebUI. Front-end for the cluster's web
# services; grows as more roles add routes.

# /admin basic_auth (ADR-0018 turns ADR-0008's seam on). The hash is a runtime
# secret so it is never committed; without it the panel — which holds the activation
# grant — would be open, so this refuses rather than degrading quietly.
- name: Read the /admin basic_auth hash
  ansible.builtin.slurp:
    src: "{{ caddy_admin_hash_file }}"
  register: admin_hash_raw
  failed_when: false

- name: Settle the /admin basic_auth hash
  ansible.builtin.set_fact:
    admin_basic_auth_hash: "{{ (admin_hash_raw.content | default('') | b64decode) | trim }}"

- name: Assert the /admin basic_auth hash is set
  ansible.builtin.assert:
    that: admin_basic_auth_hash | length > 0
    fail_msg: >-
      /admin has no basic_auth hash at {{ caddy_admin_hash_file }}, and the control
      panel holds the activation grant — it cannot be served open (ADR-0018).
      Generate one, once:   ./sparky.sh admin-password

- name: Ensure Caddy directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ caddy_dir }}"
    - "{{ caddy_dir }}/landing"
    - "{{ caddy_dir }}/data"

- name: Template the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: restart caddy

# Static — file_server serves it live, so no reload needed on content change.
- name: Template the landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ caddy_dir }}/landing/index.html"
    mode: "0644"
    owner: root
    group: root

# ONE stylesheet for all four pages — `sparky cluster`, `cluster control`,
# `cluster scoreboard`, `cluster metrics`. The source of truth lives with the control
# panel because that app serves it at /admin/static; the landing page is a static file
# under a different root, so the same file is copied here rather than duplicated in the
# repo. Reaching across roles for a `src:` is deliberate: the alternative is two copies
# that drift, which is exactly what this replaced (this page carried the panel's OLD
# 42rem body rule long after the panel moved on).
- name: Install the shared stylesheet beside the landing page
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/control-panel/files/app/static/app.css"
    dest: "{{ caddy_dir }}/landing/app.css"
    mode: "0644"
    owner: root
    group: root

- name: Template the Caddy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Bring up Caddy
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ caddy_dir }}"
  register: caddy_up
  changed_when: >-
    ('Started' in caddy_up.stderr) or ('Created' in caddy_up.stderr)
    or ('Recreated' in caddy_up.stderr)

# Apply a Caddyfile change now (graceful reload) so the wait below sees it.
- name: Apply pending Caddy config reload
  ansible.builtin.meta: flush_handlers

- name: Wait for the landing page to respond on :80
  ansible.builtin.uri:
    url: http://127.0.0.1:80/
    status_code: 200
  register: caddy_landing
  until: caddy_landing.status is defined and caddy_landing.status == 200
  retries: 15
  delay: 2
  changed_when: false
  when: not ansible_check_mode
