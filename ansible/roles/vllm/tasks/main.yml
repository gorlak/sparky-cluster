---
# Topology-driven vLLM engines. The profile's `serving_topology` is the source
# of truth; this role templates one systemd unit per (engine, node) for every
# vllm engine that includes this host, and prunes any vllm-* unit that's no
# longer desired (including the legacy vllm.service / vllm-worker.service from
# before the refactor). Node identity — rank, API host, master_addr — is
# COMPUTED from the engine's node list. See docs/serving-topology.md.
#
# Bring-up only. API readiness waits run in a later play (tasks_from: wait) so
# all workers are configured before any head blocks on rendezvous.

- name: Select the vLLM engines that run on this host
  ansible.builtin.set_fact:
    host_vllm_engines: "{{ host_vllm_engines | default([]) + [item] }}"
  loop: "{{ serving_topology | default([]) | selectattr('kind', 'equalto', 'vllm') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: inventory_hostname in item.nodes

- name: Compute the desired unit names for this host
  ansible.builtin.set_fact:
    desired_vllm_units: >-
      {{ host_vllm_engines | default([]) | map(attribute='name')
         | map('regex_replace', '^', 'vllm-') | map('regex_replace', '$', '.service')
         | list }}

# --- prune: drop vLLM units this host should no longer run -------------------
- name: Find existing vLLM unit files
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: ['vllm.service', 'vllm-*.service']
  register: vllm_unit_files

- name: Stop and disable pruned vLLM units
  ansible.builtin.systemd:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  loop: "{{ vllm_unit_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in desired_vllm_units
  failed_when: false

- name: Remove pruned vLLM containers
  ansible.builtin.command: "docker rm -f {{ item.path | basename | regex_replace('\\.service$', '') }}"
  loop: "{{ vllm_unit_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in desired_vllm_units
  changed_when: false
  failed_when: false

- name: Remove pruned vLLM unit files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vllm_unit_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in desired_vllm_units

- name: Reload systemd after pruning
  ansible.builtin.systemd:
    daemon_reload: true

# --- bring up the desired engines -------------------------------------------
- name: Configure and start each vLLM engine on this host
  ansible.builtin.include_tasks: engine.yml
  loop: "{{ host_vllm_engines | default([]) }}"
  loop_control:
    loop_var: engine
    label: "{{ engine.name }} (rank {{ engine.nodes.index(inventory_hostname) }})"
