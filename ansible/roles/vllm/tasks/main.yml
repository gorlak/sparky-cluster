---
# Deploy a vLLM systemd service (head or worker, decided by group_vars).
# The unit is templated from one .j2; only restarts when the unit actually
# changes, so a no-op re-run won't trigger an expensive ~50GB weight reload.

- name: Install {{ service_name }} unit
  ansible.builtin.template:
    src: vllm.service.j2
    dest: "/etc/systemd/system/{{ service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart vllm

- name: Enable {{ service_name }} (reload unit definitions)
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    enabled: true
    daemon_reload: true

# Apply a pending restart now (if the unit changed) so the API wait below
# observes the NEW process, not the old one. Handlers otherwise run at play end.
- name: Apply restart if the unit changed
  ansible.builtin.meta: flush_handlers

- name: Ensure {{ service_name }} is running
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: started

- name: Wait for the vLLM API to report ready (head only)
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/v1/models
    status_code: 200
  register: vllm_api
  # `is defined` guard: during startup the API refuses connections and the uri
  # result has no .status — without the guard the until errors instead of
  # retrying. Skipped under --check (nothing has actually restarted).
  until: vllm_api.status is defined and vllm_api.status == 200
  retries: 120
  delay: 10
  changed_when: false
  when: node_role == 'head' and not ansible_check_mode
