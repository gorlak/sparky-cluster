---
# Configure + start one vLLM engine on this host. `engine` is the topology entry
# (loop_var from main.yml); rank / API-ness / master_addr are computed from its
# node list in the template. Only restarts when the unit actually changes, so a
# no-op re-run won't trigger an expensive weight reload.

- name: Install vllm-{{ engine.name }}.service
  ansible.builtin.template:
    src: vllm.service.j2
    dest: "/etc/systemd/system/vllm-{{ engine.name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: engine_unit

# Clear the fail-safe boot marker (ADR-0011). A deploy is operator-initiated, so
# it must always proceed — even after a prior run left the marker behind by
# hanging the host. Without this, the unit's ConditionPathExists would make the
# `started` step below silently no-op on a post-hang recovery deploy. (A restart
# clears the marker itself via ExecStopPost; this covers the start-from-stopped
# recovery case.)
- name: Clear the fail-safe marker so this deploy can (re)start the engine
  ansible.builtin.file:
    path: "{{ vllm_state_dir }}/vllm-{{ engine.name }}.running"
    state: absent

- name: Enable vllm-{{ engine.name }}.service (reload unit definitions)
  ansible.builtin.systemd:
    name: "vllm-{{ engine.name }}.service"
    enabled: true
    daemon_reload: true

- name: Restart vllm-{{ engine.name }}.service if the unit changed
  ansible.builtin.systemd:
    name: "vllm-{{ engine.name }}.service"
    state: restarted
  when: engine_unit.changed

# NOTE: worker reconnect-on-head-restart is handled in the unit TEMPLATE, not here.
# When the head restarts it opens a new torch.distributed TCPStore; a worker that
# didn't also restart holds a stale connection and won't reconnect on its own (its
# heartbeat monitor logs broken-pipe but never exits). vllm.service.j2 embeds a hash
# of the engine spec in the WORKER unit, so any head-side change re-renders (⇒ the
# "restart if changed" task above restarts) the worker too — head + workers restart
# as a matched pair. This replaces an earlier cross-host "reconnect stale worker"
# task whose hostvars[worker].engine_unit read was unreliable inside this looped
# include_tasks (undefined ⇒ crash; guarding it ⇒ silent skip ⇒ orphaned worker).

- name: Ensure vllm-{{ engine.name }}.service is running
  ansible.builtin.systemd:
    name: "vllm-{{ engine.name }}.service"
    state: started
