---
# Wait for the API of every engine where THIS host is the API node (rank 0) to
# report ready. Runs as a separate play after all engines are brought up, so a
# head only starts polling once its worker(s) exist to rendezvous with.
# `host_vllm_engines` was set as a fact during bring-up (persists across plays).

- name: Wait for vLLM API — {{ item.name }} on :{{ item.port }}
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.port }}/v1/models"
    status_code: 200
  register: vllm_api
  # `is defined` guard: during startup the API refuses connections and the uri
  # result has no .status — without the guard `until` errors instead of retrying.
  # Skipped under --check (nothing has actually restarted).
  until: vllm_api.status is defined and vllm_api.status == 200
  retries: 120
  delay: 10
  changed_when: false
  loop: "{{ host_vllm_engines | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.nodes[0] == inventory_hostname
    - not ansible_check_mode
