---
# Container images as first-class sourced artifacts (ADR-0013). Symmetric IN
# PRINCIPLE to the `model` role — sourced, versioned, idempotent, present on every
# node, codified in-repo — but using Docker's native pull/build rather than rsync
# (Docker owns image distribution; you don't rsync /var/lib/docker). Runs on
# hosts:all in the first play, so every image a profile might SELECT via
# `vllm_image:` is GUARANTEED present before the vllm role docker-runs any unit.
#
# Declaration: `container_images` in group_vars/all.yml. Each entry is either a
# `pull:` (upstream image, ideally digest-pinned) or a `build:` (derived image,
# built from a Dockerfile committed under this role's files/<context>/). This is the
# codified, all-nodes replacement for the old manual "docker pull on both nodes,
# digests must match" suite step.
#
# Raw `docker` CLI (via command), not community.docker — matches how the rest of the
# repo talks to Docker (raw `docker run` in the vllm units) and needs no docker-py
# SDK on the nodes.

- name: Ensure each declared container image is present (pull or build)
  ansible.builtin.include_tasks: ensure_one.yml
  loop: "{{ container_images }}"
  loop_control:
    loop_var: image
    label: "{{ image.pull | default(image.build) }} -> {{ image.hosts | default('all') }}"
  # Per-image placement, defaulting to every node. Grafana and Open WebUI run only on
  # the head, and pulling them onto a worker would waste disk on an image it can never
  # run — the same reasoning that stopped mirroring every model to every node.
  when: inventory_hostname in groups[image.hosts | default('all')]

# The probe (ADR-0019) may only introspect an image this deploy guaranteed. Writing
# that set here, root-owned, is what makes "probing something new is a deploy" true
# rather than aspirational — and it is per-node, so a worker cannot be asked about a
# head-only image it does not hold.
- name: Ensure /opt/vllm/images exists
  ansible.builtin.file:
    path: "{{ probe_image_allowlist | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Publish the probe's image allowlist for this node
  ansible.builtin.template:
    src: image-allowlist.j2
    dest: "{{ probe_image_allowlist }}"
    owner: root
    group: root
    mode: "0644"
  become: true

    # --- reclaim: converge the image store to the declaration ----------------------
    # Symmetric with the `model` role's weight eviction and gated on the SAME switch
    # (`./sparky.sh deploy --evict`), so one gesture reclaims both. Without it this is a
    # plan and nothing is deleted. `container_images` is the statement of which images
    # SHOULD exist; anything else in a repository we own is reclaimable.
- name: Read the images actually present on this node
  # `--digests` is essential, not decoration. Upstream images are pulled BY DIGEST and
  # `docker pull repo@sha256:…` creates no tag, so they list as `repo:<none>` with the
  # digest in its own column. Matching on repository:tag alone would never recognise
  # them — and they are exactly the images worth reclaiming (26.04 and 26.06 sat on both
  # nodes unused). Remove by ID, which is unambiguous however the image was named.
  ansible.builtin.command:
    cmd: docker images --digests --format '{{ "{{.Repository}}|{{.Tag}}|{{.Digest}}|{{.ID}}|{{.Size}}" }}'
  register: present_images
  changed_when: false
  # Read-only, so it must ALSO run under `--check` — otherwise Ansible skips every
  # `command` task, `present_images` comes back skipped, and the reclaim plan below has
  # nothing to report. `deploy --check --evict` is advertised (cli.py) as the way to ask
  # "what would an evicting deploy delete?", and without this it answered "nothing" no
  # matter what was on the node: a DESTRUCTIVE operation whose dry run returns an empty
  # list is worse than one with no dry run, because empty reads as reassurance.
  check_mode: false

- name: Work out which references this node still needs
  ansible.builtin.set_fact:
    # Derived from the same declaration the pulls above converge to, so the keep-set
    # cannot drift from what was installed.
    declared_images: >-
      {{ (container_images
          | rejectattr('hosts', 'defined')
          | map(attribute='pull', default='') | list)
         + (container_images
            | selectattr('hosts', 'defined')
            | selectattr('hosts', 'in', group_names)
            | map(attribute='pull', default='') | list)
         + (container_images | map(attribute='build', default='') | list)
         | select | list }}

# The reclaim is scoped to REPOSITORIES this project declares. Without this the keep-set
# was `container_images` and the candidate set was *every image on the node*, so a deploy
# --evict deleted images belonging to anyone else using the box — the log even called them
# "named by no `container_images` entry", which reads like our own stale layer rather than
# somebody's work. This cluster does not own the Docker daemon; it owns its own repos.
- name: Work out which REPOSITORIES this project owns
  ansible.builtin.set_fact:
    declared_repos: >-
      {{ declared_images
         | map('regex_replace', '@.*$', '')
         | map('regex_replace', ':[^/]*$', '')
         | unique | list }}

- name: Plan the image reclaim on this node
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: docker holds {{ present_images.stdout_lines | length }}
      image(s); {{ reclaimable | length }} are in a repository this project owns
      ({{ declared_repos | join(', ') }}) but are named by no `container_images` entry
      for this node — {{ reclaimable | map('regex_replace', '\\|.*$', '') | list }}.
      Images in any OTHER repository belong to someone else and are never touched.
      Dangling layers from earlier builds are reclaimed separately and are always safe.
      {{ 'RECLAIMING now (evict_weights=true).' if evict_weights | bool
         else 'NOT reclaiming — this is a plan; ./sparky.sh deploy --evict applies it.' }}
  vars:
    reclaimable: >-
      {{ present_images.stdout_lines
         | reject('search', '^<none>\\|<none>')
         | select('search', '^(' ~ (declared_repos | join('|')) ~ ')\\|')
         | reject('search', '\\|' ~ (declared_images | join('$|\\|')) ~ '$')
         | list }}

# Dangling first and separately: untagged layers orphaned by REBUILDS of the derived
# image (its Dockerfile changes whenever the WAR does). Nothing can reference them by
# name, so reclaiming them is safe and is usually where most of the space is.
#
# FILTERED BY OUR LABEL, because a bare `docker image prune` is DAEMON-WIDE: it would
# also delete another user's orphaned build layers, which are not ours to collect. The
# label is set in the derived image's Dockerfile, so only orphans of our own builds
# match. Orphans predating the label are simply left alone — the safe direction.
- name: Reclaim dangling image layers from OUR builds only
  ansible.builtin.command:
    cmd: docker image prune --force --filter label=net.flummoxed.sparky-cluster=true
  register: prune_dangling
  when: evict_weights | bool
  changed_when: "'Total reclaimed space: 0B' not in prune_dangling.stdout"

# `docker rmi` refuses while a container holds the image — including the engine serving
# right now. That is the desired outcome rather than an error: failing a deploy over a
# reclaim would be worse than keeping a stale image, so failures are tolerated, counted
# and reported.
- name: Reclaim images this node's declaration no longer names
  ansible.builtin.command:
    cmd: "docker rmi {{ item.split('|')[3] }}"
  loop: "{{ present_images.stdout_lines }}"
  loop_control:
    label: "{{ item.split('|')[0] }}:{{ item.split('|')[1] }} ({{ item.split('|')[4] }})"
  when:
    - evict_weights | bool
    # keep truly-dangling for the prune above; it handles them wholesale
    - not (item.split('|')[0] == '<none>' and item.split('|')[1] == '<none>')
    # kept if the declaration names it by digest, by repo:tag, or by bare name (built)
    - (item.split('|')[0] ~ '@' ~ item.split('|')[2]) not in declared_images
    - (item.split('|')[0] ~ ':' ~ item.split('|')[1]) not in declared_images
    - item.split('|')[0] not in declared_images
    # NOT OURS, NOT OUR BUSINESS. The candidate must live in a repository this project
    # declares; anything else on the daemon belongs to another user and is left alone.
    - item.split('|')[0] in declared_repos
  register: rmi_result
  failed_when: false
  changed_when: rmi_result.rc == 0

- name: Report images that could not be reclaimed
  ansible.builtin.debug:
    msg: >-
      Kept — in use by a running container, which is correct: an image cannot be removed
      while an engine serves from it.
      {{ rmi_result.results | default([]) | selectattr('rc', 'defined')
         | selectattr('rc', 'ne', 0) | map(attribute='item')
         | map('regex_replace', '\\|.*$', '') | list }}
  when:
    - evict_weights | bool
    - rmi_result.results | default([]) | selectattr('rc', 'defined')
      | selectattr('rc', 'ne', 0) | list | length > 0
