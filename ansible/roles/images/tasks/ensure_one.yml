---
# Ensure one container image is present on this node. `image` is the loop var: one
# declaration from `container_images` — either
#   {pull: <ref>}                    upstream, ideally <ref>@sha256:<digest>
#   {build: <tag>, context: <dir>}   derived, built from files/<dir>/Dockerfile
#
# PULL is skipped when the image is already local — safe, because the ref is a digest, so
# "already local" means byte-identical by construction.
#
# BUILD is ALWAYS invoked. A derived image's tag never changes, so the tag's presence says
# nothing about whether it was built from the CURRENT Dockerfile; gating on presence would
# silently keep serving a stale image after its Dockerfile changed. Docker's layer cache
# makes an unchanged context a ~1s no-op. The Dockerfile is the source of truth, not the tag.

- name: Is {{ image.pull | default(image.build) }} already present on this node?
  ansible.builtin.command: "docker image inspect {{ image.pull | default(image.build) }}"
  register: image_present
  changed_when: false
  failed_when: false

# --- upstream: pull (pinned by digest where filled in) -------------------------
- name: Pull {{ image.pull | default('') }}
  ansible.builtin.command: "docker pull {{ image.pull }}"
  when:
    - image.pull is defined
    - image_present.rc != 0
  changed_when: true

# --- derived: build from an in-repo Dockerfile ---------------------------------
# The build context must exist on the TARGET node, so stage it there (copy reads
# from the control node's role files/, pushes to each node) then build.
- name: Build {{ image.build | default('') }} from files/{{ image.context | default('') }}/
  when: image.build is defined
  block:
    - name: Stage the {{ image.build }} build context on this node
      ansible.builtin.copy:
        src: "{{ image.context }}/"
        dest: "{{ images_build_dir }}/{{ image.context }}/"
        mode: "0644"

    - name: docker build {{ image.build }}
      ansible.builtin.command:
        cmd: "docker build -t {{ image.build }} {{ images_build_dir }}/{{ image.context }}"
      register: image_build
      changed_when: false          # decided below, by identity, not by log-scraping

    # Did the build actually produce a different image? Compare the inspect output
    # before and after: identical means every layer was cached and nothing moved.
    # Deliberately not parsed out of the build log — buildkit's cache wording is not a
    # stable interface, and a heuristic that silently reports "changed" on every deploy
    # is worse than no signal at all.
    - name: Did {{ image.build }} change?
      ansible.builtin.command: "docker image inspect {{ image.build }}"
      register: image_after
      changed_when: image_after.stdout != image_present.stdout
