# NCCL environment for multi-node tensor parallelism over ConnectX-7 RoCE.
# Loaded by the vLLM services on both nodes via EnvironmentFile=. Must be
# byte-identical across nodes — a mismatched NCCL_IB_HCA or GID index is a
# classic source of multi-node hangs.

# Pin the TCP bootstrap socket to the ConnectX-7 interface so NCCL's
# rendezvous doesn't accidentally go over 10GbE mgmt.
NCCL_SOCKET_IFNAME=enp1s0f1np1

# Use the ConnectX-7 RoCE HCA for the actual data plane (InfiniBand verbs
# over RoCEv2). The second CX-7 (rocep2*) is deliberately unused per NVIDIA's
# DGX Spark guidance.
NCCL_IB_HCA=rocep1s0f1

# RoCEv2 GID index. 3 is the conventional index for IPv4-based RoCEv2 on
# these cards; if NCCL_DEBUG later shows "no GID found" we'll revisit.
NCCL_IB_GID_INDEX=3

# Enable GPUDirect RDMA at the highest tier — lets the NIC DMA directly to/from
# GPU memory without bouncing through host RAM. Level 5 = use GDR whenever
# topology allows.
NCCL_NET_GDR_LEVEL=5

# Explicitly enable IB transport (i.e. don't fall back to plain sockets).
NCCL_IB_DISABLE=0

# Disable NVLS (NVIDIA Scalable Link Service / multicast collectives). NVLS needs
# NVLink, which GB10 nodes do NOT have between them (our only interconnect is
# ConnectX-7 RoCE) — so it can never help here, only hurt. NCCL 2.30.4+ (shipped
# in container 26.06 as nccl 2.30.5) has an NVLS code path that HARD-HANGS dual
# DGX Spark at multinode bring-up (nodes go SSH-unresponsive; we hit this on
# 2026-07-02 and had to hard-reset both). Zero-cost on 26.04's nccl 2.29.7 (NVLS
# already unused); required to make the 26.06 upgrade viable.
# Refs: DEF-0001 (docs/defects.md) · NVIDIA/nccl#2167 · docs/upgrades/container-nvidia-vllm-26.06-py3.md
NCCL_NVLS_ENABLE=0

# Uncomment during first bring-up to get verbose NCCL logs in journalctl.
# NCCL_DEBUG=INFO
