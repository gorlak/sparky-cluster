# NCCL environment for multi-node tensor parallelism over ConnectX-7 RoCE.
# Loaded by the vLLM services on both nodes via EnvironmentFile=. Must be
# byte-identical across nodes — a mismatched NCCL_IB_HCA or GID index is a
# classic source of multi-node hangs.

# Pin the TCP bootstrap socket to the ConnectX-7 interface so NCCL's
# rendezvous doesn't accidentally go over 10GbE mgmt.
NCCL_SOCKET_IFNAME=enp1s0f1np1

# Use the ConnectX-7 RoCE HCA for the actual data plane (InfiniBand verbs
# over RoCEv2). The second CX-7 (rocep2*) is deliberately unused per NVIDIA's
# DGX Spark guidance.
NCCL_IB_HCA=rocep1s0f1

# RoCEv2 GID index. 3 is the conventional index for IPv4-based RoCEv2 on
# these cards; if NCCL_DEBUG later shows "no GID found" we'll revisit.
NCCL_IB_GID_INDEX=3

# Enable GPUDirect RDMA at the highest tier — lets the NIC DMA directly to/from
# GPU memory without bouncing through host RAM. Level 5 = use GDR whenever
# topology allows.
NCCL_NET_GDR_LEVEL=5

# Explicitly enable IB transport (i.e. don't fall back to plain sockets).
NCCL_IB_DISABLE=0

# NVLS (NVIDIA Scalable Link Service / multicast collectives) killswitch — DEF-0001.
#
# NVLS needs NVLink, which GB10 nodes do NOT have between them (our only interconnect
# is ConnectX-7 RoCE), so it can never help here — only hurt. NCCL 2.30.4+ (shipped in
# container 26.06 as nccl 2.30.5) has an NVLS code path that HARD-HANGS dual DGX Spark
# at multinode bring-up: both nodes go SSH-unresponsive and need a physical reset. We
# hit that on 2026-07-02.
#
# LIFTED AND VERIFIED 2026-08-08 — the defect is closed, its register row deleted.
# Container 26.07 ships **NCCL 2.30.7**, past the 2.30.6 bar the defect named. A TP=2
# bring-up of `minimax-m2.7-nvfp4` with NVLS enabled completed normally:
#
#   vLLM is using nccl==2.30.7
#   world_size=2 rank=0 distributed_init_method=tcp://10.0.200.12:29501 backend=nccl
#   Using ['PYNCCL'] all-reduce backends for group 'tp:0'
#   … weights loaded, smoke gate pass, both nodes reachable throughout
#
# NVLS was genuinely available to be selected, not skipped for an unrelated reason —
# which is what makes this a real test rather than a lucky one. This was the only WAR
# that could not be tested per-profile (the file is cluster-wide and byte-identical on
# both nodes), so it was done last and alone, against a soaked TP=2 baseline.
#
#   IF A FUTURE MULTINODE BRING-UP EVER HANGS: put `NCCL_NVLS_ENABLE=0` back and
#   `./sparky.sh deploy`. If both nodes are unresponsive, hard-reset them first — the
#   ADR-0009 boot gate brings them up empty and reachable, so the deploy goes through.
#
# Refs: NVIDIA/nccl#2167 · docs/upgrades/container-nvidia-vllm-26.07-py3.md

# Uncomment during first bring-up to get verbose NCCL logs in journalctl.
# NCCL_DEBUG=INFO
