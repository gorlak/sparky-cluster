<div id="actionarea">
  <h2>actions</h2>
  <p class="hint">
    Live: <code>{{ profile }}</code> · runs as <code>activator</code> —
    the only privileged action here is <em>activate</em>, and it can only choose from
    what a deploy already installed.
  </p>

  <div style="display:flex; align-items:center; gap:.6rem; margin:.6rem 0 1rem">
    <label for="profile-select" style="font-size:.9rem; opacity:.7; white-space:nowrap">Activate profile</label>
    <select id="profile-select" name="profile" class="btn" style="padding:.35rem .6rem">
      {% for p in profiles %}
        <option value="{{ p }}"{% if p == profile %} selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="actions">
    {% for a in actions %}
      <button class="btn {{ 'danger' if a.danger }}"
              onclick="document.getElementById('dlg-{{ a.name }}').showModal()">{{ a.label }}</button>
    {% endfor %}
  </div>


  {% for a in actions %}
    <dialog id="dlg-{{ a.name }}">
      <h3>{{ a.label }}?</h3>
      <p>{{ a.desc }}</p>
      <menu class="modal-actions">
        <button class="btn" onclick="this.closest('dialog').close()">Cancel</button>
        <button class="btn {{ 'danger' if a.danger }}"
                hx-post="{{ root }}/run/{{ a.name }}"
                hx-include="#profile-select"
                hx-target="#actionarea" hx-swap="outerHTML"
                onclick="this.closest('dialog').close()">Confirm</button>
      </menu>
    </dialog>
  {% endfor %}
</div>
