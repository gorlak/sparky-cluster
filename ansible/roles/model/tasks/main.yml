---
# Install model weights into {{ vllm_models_dir }} for every vllm engine that
# runs on this host (idempotent: skips models already present). Models are
# derived from the profile's serving_topology — see docs/serving-topology.md.
#
# Cross-node note: staging lives at {{ model_cache_dir }} (control node only).
# Distributing weights to the worker is not yet automated here — nodes that
# already hold them no-op. A future task can rsync sparky -> snoopy first.

- name: Collect the models this host needs
  ansible.builtin.set_fact:
    host_models: "{{ (host_models | default([]) + [item.model]) | unique }}"
  loop: "{{ serving_topology | default([]) | selectattr('kind', 'equalto', 'vllm') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: inventory_hostname in item.nodes

- name: Install each required model from staging if missing
  ansible.builtin.include_tasks: install_one.yml
  loop: "{{ host_models | default([]) }}"
  loop_control:
    loop_var: model
    label: "{{ model }}"
