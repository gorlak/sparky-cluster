---
# What proves a model directory is a MODEL and not a half-copied folder. ANY descriptor in
# this list counts: HuggingFace repos ship `config.json`, Mistral-native ones ship
# `params.json` and no `config.json` at all.
#
# Keep it SHORT and descriptor-only — it is a sentinel, not a validator. A `*.safetensors`
# glob would accept a directory with tensors but no way to interpret them, which is the
# half-staged state this exists to catch. Partial downloads are caught by the
# `*.incomplete` scan.
model_descriptors:
  - config.json   # HuggingFace layout
  - params.json   # Mistral-native layout (mistral-common / consolidated-*.safetensors)
