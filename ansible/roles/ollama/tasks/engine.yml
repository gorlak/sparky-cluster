---
# Configure + start one Ollama engine on this host, then pull its models.
# `engine` is the topology entry (loop_var from main.yml). Only restarts when the
# unit actually changes; model pulls are idempotent (skipped if already present).

- name: Ensure data dir for ollama-{{ engine.name }}
  ansible.builtin.file:
    path: "{{ ollama_data_dir }}/{{ engine.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install ollama-{{ engine.name }}.service
  ansible.builtin.template:
    src: ollama.service.j2
    dest: "/etc/systemd/system/ollama-{{ engine.name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: engine_unit

- name: Enable ollama-{{ engine.name }}.service (reload unit definitions)
  ansible.builtin.systemd:
    name: "ollama-{{ engine.name }}.service"
    enabled: true
    daemon_reload: true

- name: Restart ollama-{{ engine.name }}.service if the unit changed
  ansible.builtin.systemd:
    name: "ollama-{{ engine.name }}.service"
    state: restarted
  when: engine_unit.changed

- name: Ensure ollama-{{ engine.name }}.service is running
  ansible.builtin.systemd:
    name: "ollama-{{ engine.name }}.service"
    state: started

- name: Wait for ollama-{{ engine.name }} API to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ engine.port }}/api/version"
    status_code: 200
  register: ollama_ready
  until: ollama_ready.status is defined and ollama_ready.status == 200
  retries: 30
  delay: 2
  changed_when: false
  when: not ansible_check_mode

- name: List models already present in ollama-{{ engine.name }}
  ansible.builtin.command: "docker exec ollama-{{ engine.name }} ollama list"
  register: ollama_models_present
  changed_when: false
  when: not ansible_check_mode

- name: Pull models for ollama-{{ engine.name }}
  ansible.builtin.command: "docker exec ollama-{{ engine.name }} ollama pull {{ item }}"
  loop: "{{ engine.models | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - not ansible_check_mode
    - item not in (ollama_models_present.stdout | default(''))
  changed_when: true
