---
# Infrastructure constants — the same across every profile. Profile files
# (profiles/*.yml) layer the per-deployment choices (model, TP, flags) on top.

# Container runtime — the cluster DEFAULT image, overridable per profile. Built for
# GB10 / SM12.1 (see CLAUDE.md). A profile may set its own `vllm_image` in the profile
# YAML (extra-vars outrank group_vars), so different models can run different containers
# on the same cluster. Whatever a profile selects must be listed in `container_images`
# below, which the `images` role guarantees present on every node (ADR-0013).
#
# Default 26.04 (vLLM 0.19, NCCL 2.29.7) is the stable, known-good image. AWQ /
# compressed-tensors MoE models (minimax, step-3.5) MUST stay here — 26.06 hangs loading
# them (Marlin-MoE load bug on sm_121). 26.06 (needed for NVFP4) is opt-in per profile:
# profiles/step-3.7-nvfp4.yml pins it. Full story + WAR register + fail-safe boot (ADR-0009):
# docs/upgrades/container-nvidia-vllm-26.06-py3.md.
# Referenced by DIGEST, not by tag. `docker pull repo@sha256:…` creates no local tag,
# so a unit that ran `…:26.04-py3` would, on a fresh node, find nothing and trigger an
# unpinned runtime pull — reintroducing the very drift ADR-0013 pins against. Pull and
# run must name the same immutable thing.
vllm_image: nvcr.io/nvidia/vllm@sha256:98494fdaea68ad892c107180b0be41c99caa3c77683175becc4e202b2cb75b27  # :26.04-py3 — vLLM 0.19
# The 26.06 base the derived image builds FROM (its Dockerfile pins the same digest).
vllm_image_2606: nvcr.io/nvidia/vllm@sha256:6e537fc8d84beb9b60e789236168141d2ef4420bc28cbb85ec7d4318ca918b6c  # :26.06-py3 — vLLM 0.22.1

# Container images required on every node (ADR-0013), ensured by the `images` role
# in the first play — `docker pull` for upstream images, `docker build` for derived
# ones (Dockerfiles under roles/images/files/<context>/). This is the codified,
# all-nodes replacement for the old manual "docker pull on both nodes, digests must
# match" runbook step: per-profile `vllm_image:` above SELECTS which of these a
# profile runs; this list GUARANTEES they (and their build bases) exist.
#
# Pinning: upstream `pull:` entries are pinned by digest (…@sha256:…) so a bump is a
# deliberate digest change and both nodes are byte-identical by construction (the
# registry manifest digest is content-addressed — the same tag resolves to the same
# digest on every node). Re-read with `docker images --digests` when bumping. The tag
# each digest corresponds to is in the trailing comment.
#
# `hosts:` places an image where it is actually run (default: all nodes). The same
# principle as per-node weights: snoopy has no reason to hold Grafana. Each entry
# references the `*_image` var defined alongside its service, so a bump is one line and
# the pull, the compose file and the unit can never disagree.
container_images:
  # --- serving: any node may run any engine, so these go everywhere -------------
  - pull: "{{ vllm_image }}"
  - pull: "{{ vllm_image_2606 }}"
  # dgx-spark/vllm:26.06-fastapi-fix — 26.06 + fastapi<0.137 WAR for DEF-0005 (see the
  # Dockerfile). Built locally, so it has no registry digest to pin.
  - build: dgx-spark/vllm:26.06-fastapi-fix
    context: vllm-26.06-fastapi-fix
  # --- front-end: head only -----------------------------------------------------
  - pull: "{{ webui_image }}"
    hosts: head
  - pull: "{{ caddy_image }}"
    hosts: head
  - pull: "{{ prometheus_image }}"
    hosts: head
  - pull: "{{ grafana_image }}"
    hosts: head
  # --- exporters: every node ----------------------------------------------------
  - pull: "{{ node_exporter_image }}"
  - pull: "{{ nvidia_exporter_image }}"

# Host paths
vllm_models_dir: /opt/vllm/models
nccl_conf_path: /opt/vllm/nccl-env.conf

# Persistent per-engine boot sentinel dir (ADR-0009 fail-safe boot). A marker
# {{ vllm_state_dir }}/vllm-<engine>.running is touched at start and removed on
# any CLEAN stop (systemd ExecStopPost). If it survives to the next boot — the
# only way that happens is an unclean shutdown: a hang / hard-reset / power cut —
# the unit's ConditionPathExists skips auto-start, so the node boots empty and
# reachable instead of re-attempting the risky load unattended. Must be on
# persistent disk (NOT /run or /tmp, which are cleared on boot).
vllm_state_dir: /opt/vllm/state

# --- deploy / activate split (ADR-0018) --------------------------------------
# `deploy` (this playbook, human, password-gated) renders ONE env file per
# allowlisted engine into {{ vllm_engines_dir }} and installs a single systemd
# TEMPLATE unit (vllm@.service). `activate` (unprivileged, agent-drivable) writes
# a desired profile and runs the fixed reconciler, which writes the PER-NODE
# desired markers in {{ vllm_active_dir }} and drives systemd to match.
#
# A unit boots iff  desired (marker in {{ vllm_active_dir }})  AND  cleanly
# stopped last time (no marker in {{ vllm_state_dir }}) — two ConditionPathExists
# gates, so boot never depends on the reconciler existing.
vllm_engines_dir: /opt/vllm/engines
vllm_active_dir: /opt/vllm/active
# The activatable-profile allowlist the reconciler re-validates every request
# against (one profile name per line; `blocked: true` profiles are excluded —
# their weights and env files are kept, but they cannot be activated).
vllm_allowlist_file: "{{ vllm_engines_dir }}/allowlist"

# The reconciler: a small, fixed, root-owned ONESHOT script (not a daemon).
# Invoked through two bounded triggers — a single-command sudoers entry locally,
# and forced-command SSH cross-node. See roles/activate.
activate_bin: /usr/local/sbin/vllm-activate
activate_conf: /opt/vllm/activate.conf
# The dedicated LOW-PRIVILEGE activation identity (the control panel service and
# the agent). It holds the two trigger grants and nothing else — no sudo beyond
# {{ activate_bin }}, no docker group, no ansible. `activate_group` also carries
# geoff, so `./sparky.sh activate` needs no password.
activate_user: activator
activate_group: activate
activate_ssh_key: "/home/{{ activate_user }}/.ssh/id_ed25519"
# The activation REQUEST: group-writable, written with no sudo at all.
desired_profile_file: /opt/cluster/desired-profile
# What `deploy` provisioned (the allowlist, per-node engines + weights). Read by
# the control panel and agents; the counterpart of current-topology.json ("what is
# live"), which the reconciler writes.
fleet_state_file: /opt/cluster/fleet.json

# The stable, model-agnostic served name every engine ALSO advertises (vLLM takes
# several `--served-model-name` values). Chat targets this; bench/eval target the
# engine's real `served_as`. Makes conversations portable across activations.
stable_model_name: sparky
# The one well-known front port. At most ONE live engine per port fleet-wide (the
# reconciler stops-then-starts), which is what lets Caddy carry a STATIC
# health-checked upstream list and follow activation with no config rewrite.
# The fleet role asserts every engine declares this port.
vllm_api_port: 8000
# The fixed model endpoint Open WebUI + Prometheus point at, configured once at
# deploy time. Caddy resolves it to whichever node is currently serving.
model_endpoint_host: "api.{{ web_domain }}"
model_endpoint_url: "http://api.{{ web_domain }}"

# Convergent weight removal: a model no longer in the allowlist is EVICTED from
# the nodes that held it. Plan-by-default (deploy prints what it would delete);
# pass `-e evict_weights=true` (`./sparky.sh deploy --evict`) to actually delete.
evict_weights: false

# Service identity that owns the weights (not the deploy automation user)
vllm_user: vllm
vllm_group: vllm

# Download inbox for new model weights (head/control node only). `./sparky.sh download`
# (scripts/download.py) stages into {{ model_cache_dir }}/<MODEL>; the model role MOVES it
# into the canonical store ({{ vllm_models_dir }}) on the head, then rsync-mirrors to each
# node **the models that node actually runs** (ADR-0018) — per-node disk tracks its own
# workload, not the whole fleet. The head keeps every allowlisted model: it is the mirror
# SOURCE, so evicting a worker-only model here would leave no way to repair that worker's
# copy short of re-downloading. The inbox is transient (emptied on deploy) and workers are
# pure mirrors — no manual cross-node copy. See roles/model.
model_cache_dir: /opt/cluster/model-cache

# Multi-node rendezvous (vLLM 0.19 native multinode, no Ray) is per-engine:
# each engine's master_addr is computed from its first node's vllm_host_ip and baked
# into that engine's rendered env file (roles/vllm/templates/engine.env.j2). Default
# master port (29500) is used implicitly. Nothing to set globally here.

# Docker run / systemd memory knobs shared by all engines.
vllm_shm_size: 32g
vllm_container_memory: 120g
vllm_systemd_memory_max: 124G
# One TEMPLATE unit (ADR-0018) means these are cluster constants, not per-rank
# values. RestartSec suits the worker (it retries the rendezvous until the head is
# up); the head rarely fails fast — waiting on a peer blocks inside
# TimeoutStartSec, which is sized for a full multi-node weight load.
vllm_restart_sec: 20
vllm_start_timeout_sec: 1200

# Ollama: the role was removed by ADR-0018 — `deploy` is whole-fleet and no longer has
# a per-profile serving topology for an Ollama engine to project from, and no profile
# had declared one since the role was built. It was GPU-verified on GB10/sm_121
# (CUDA v13, 100% offload, co-resident with vLLM); recover it from git history if an
# Ollama engine is ever wanted, and give it the same env-file + template-unit shape the
# vLLM engines now have. teardown.yml still sweeps any leftover `ollama-*` unit.

# Metrics stack (P2) — see docs/control-interface.md. Exporters run on every node;
# Prometheus + Grafana on the head. (GB10 reports no GPU memory via nvidia-smi —
# that's the unified memory, covered by node-exporter.)
exporters_dir: /opt/exporters
node_exporter_image: prom/node-exporter@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205  # :latest == 1.11.1
node_exporter_port: 9100
nvidia_exporter_image: utkuozdemir/nvidia_gpu_exporter@sha256:cc407f77ab017101ce233a0185875ebc75d2a0911381741b20ad91f695e488c7  # :1.2.0
nvidia_exporter_port: 9835
# Pin query fields: GB10's nvidia-smi exposes clocks_event_reasons_* "[us]" fields
# that the exporter turns into invalid Prometheus metric names and crashes on.
# Querying an explicit safe set avoids that (GPU memory is N/A on GB10 anyway).
nvidia_exporter_query_fields: "utilization.gpu,temperature.gpu,power.draw,clocks.current.sm,clocks.current.memory"
prometheus_image: prom/prometheus@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7  # :latest == 3.13.0
prometheus_dir: /opt/prometheus
prometheus_port: 9090
grafana_image: grafana/grafana@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63  # :latest == 13.1.0
grafana_dir: /opt/grafana
grafana_port: 3000

# Open WebUI front-end (sparky, host networking). Its connections (OpenAI/Ollama
# endpoints) are generated from the profile's serving_topology by the open-webui
# role — no per-endpoint var here. Kept here (not role defaults) so teardown.yml
# can reach them too. Binds an INTERNAL port (8080) — Caddy fronts it at
# chat.{{ web_domain }}.
webui_image: ghcr.io/open-webui/open-webui@sha256:a26effeb220e132482bf7e0560b3404843e7bc40d23051144e062960df8df6b0  # :latest == 0.10.2
webui_install_dir: /opt/open-webui
webui_port: 8080
# Sent as the API key for every vLLM engine endpoint (vLLM ignores it).
webui_api_key: sk-local
# Auth. First account = admin (done). Signup is CLOSED — the admin allocates
# accounts in Admin Panel → Users; new accounts default to the "user" role.
# The open-webui role sets ENABLE_PERSISTENT_CONFIG=false, so every value here is
# authoritative on every start (config-as-code; see README "Known Shortcomings").
# For a from-scratch install, temporarily set webui_enable_signup "true" to create
# the first admin, deploy, then set it back to "false" and deploy again. (User
# accounts persist as data regardless.)
webui_auth: "true"
webui_enable_signup: "false"
webui_default_user_role: "user"

# Reverse proxy (Caddy) on :80. Landing page at the head host ({{ web_domain }});
# each service is a subdomain (<svc>.{{ web_domain }}). Needs wildcard DNS
# *.{{ web_domain }} -> sparky's IP (one record, then services are proxy-only).
web_domain: sparky.flummoxed.net
caddy_image: caddy@sha256:af5fdcd76f2db5e4e974ee92f96ee8c0fc3edb55bd4ba5032547cbf3f65e486d  # :2
caddy_dir: /opt/caddy
# /admin basic_auth (ADR-0008's seam, TURNED ON by ADR-0018 — the panel is now
# deliberately agent-drivable and holds the activation grant, so it can't stay
# open). The hash is a RUNTIME secret, never in git: generate it once with
# `./sparky.sh admin-password`, which writes this file on the head.
caddy_admin_hash_file: /opt/cluster/admin-basic-auth.hash
admin_basic_auth_user: admin

# Control panel (status + activation) — see docs/control-interface.md.
# Runs on-host as User={{ activate_user }} (ADR-0018 took it OFF the `deploy`
# identity: no web-API path to root), bound to 127.0.0.1; Caddy fronts it at
# /admin behind basic_auth. Its only privileged action is `activate`, and that
# runs through the fixed reconciler, never ansible.
control_panel_dir: /opt/cluster/control-panel
control_panel_port: 8088
# The fallback selection when nothing has been activated yet. (`cluster_ansible_dir`
# went with ADR-0018: the panel no longer runs ansible, so nothing but `sparky deploy`
# needs to know where the published tree lives.)
cluster_profile: empty
# What IS running. Written by the RECONCILER when an activation lands (ADR-0018) —
# `deploy` no longer knows what is serving, so it can't be the author. The control
# panel and the harness read it. Its counterpart is {{ fleet_state_file }} (what MAY
# run, deploy-written). See docs/serving-topology.md.
cluster_topology_file: /opt/cluster/current-topology.json
# Activation-gate breadcrumb: `./sparky.sh activate` runs the smoke gate after the
# reconciler returns and records the result here (per-engine ready/tool-shape/quality
# + overall ok, with a timestamp) — written pass OR fail. The reconciler DELETES it at
# the start of every activation, so a stale breadcrumb can never be mistaken for a
# result about the live model. See docs/control-interface.md.
cluster_smoke_report: /opt/cluster/last-smoke.json

# Links shown on the landing page (sparky.flummoxed.net/).
landing_services:
  - name: Open WebUI
    url: "http://chat.{{ web_domain }}"
    blurb: "Chat with the cluster's served model"
  - name: Admin
    url: "/admin"
    blurb: "Cluster control panel (status)"
  - name: Metrics
    url: "http://metrics.{{ web_domain }}"
    blurb: "Grafana dashboards — throughput, GPU, latency"
