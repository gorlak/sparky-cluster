---
# Infrastructure constants — the same across every profile. Profile files
# (profiles/*.yml) layer the per-deployment choices (model, TP, flags) on top.

# Container runtime — the cluster DEFAULT image, overridable per profile. Built for
# GB10 / SM12.1 (see CLAUDE.md). A profile may set its own `vllm_image` in the profile
# YAML (extra-vars outrank group_vars), so different models can run different containers
# on the same cluster. Whatever a profile selects must be listed in `container_images`
# below, which the `images` role guarantees present on every node (ADR-0013).
#
# THE DEFAULT IS THE CURRENT IMAGE. It used to be 26.04 (vLLM 0.19) while the fleet
# straddled containers; as of 2026-08-10 every profile runs the derived 26.07 image and
# `step-3.5-flash-fp8` — the last 26.04 profile — was retired. A default nobody selects is not
# harmless: a new profile that forgot `vllm_image:` would silently inherit vLLM 0.19, two
# releases behind everything we test against. The per-profile override (ADR-0013) is what
# makes a container bump adoptable model by model and it stays; what changed is only which
# image you get by saying nothing.
#
# This default is a BUILT image, not a pulled one, so it is absent from the `pull:` list
# below — the `build:` entry is what guarantees it on every node.
vllm_image: dgx-spark/vllm:26.07-xgrammar-fix
# 26.07 upstream: vLLM 0.24.0, NCCL 2.30.7. Pulled because the derived image builds FROM
# this exact digest — roles/images/files/vllm-26.07-xgrammar-fix/Dockerfile pins the same
# one, and the two must not drift. Referenced by DIGEST, not tag: `docker pull repo@sha…`
# creates no local tag, so a unit naming `:26.07-py3` would find nothing on a fresh node
# and trigger an unpinned runtime pull — the drift ADR-0013 exists to prevent.
#
# 26.06 was dropped 2026-08-10: nothing ran it and nothing built from it, yet every deploy
# pulled it to both nodes.
vllm_image_2607: nvcr.io/nvidia/vllm@sha256:95c498a475142c20c989c65e5d223348c09fed83ba17ddf44f117610c0bd3268  # :26.07-py3 — vLLM 0.24.0

# Container images required on every node (ADR-0013), ensured by the `images` role
# in the first play — `docker pull` for upstream images, `docker build` for derived
# ones (Dockerfiles under roles/images/files/<context>/). This is the codified,
# all-nodes replacement for the old manual "docker pull on both nodes, digests must
# match" runbook step: per-profile `vllm_image:` above SELECTS which of these a
# profile runs; this list GUARANTEES they (and their build bases) exist.
#
# Pinning: upstream `pull:` entries are pinned by digest (…@sha256:…) so a bump is a
# deliberate digest change and both nodes are byte-identical by construction (the
# registry manifest digest is content-addressed — the same tag resolves to the same
# digest on every node). Re-read with `docker images --digests` when bumping. The tag
# each digest corresponds to is in the trailing comment.
#
# `hosts:` places an image where it is actually run (default: all nodes). The same
# principle as per-node weights: snoopy has no reason to hold Grafana. Each entry
# references the `*_image` var defined alongside its service, so a bump is one line and
# the pull, the compose file and the unit can never disagree.
container_images:
  # --- serving: any node may run any engine, so these go everywhere -------------
  # Only the build BASE is pulled; the image every profile runs is built below.
  - pull: "{{ vllm_image_2607 }}"
  # dgx-spark/vllm:26.07-xgrammar-fix — 26.07 + `xgrammar>=0.2.1` WAR for DEF-0010 (see
  # the Dockerfile). Built locally, so it has no registry digest to pin. Replaces the
  # 26.06-fastapi-fix image: 26.07 fixed that defect and introduced this one. The
  # derived-image mechanism is what keeps us on the newest container (ADR-0013); what it
  # patches is expected to keep changing.
  - build: dgx-spark/vllm:26.07-xgrammar-fix
    context: vllm-26.07-xgrammar-fix
  # --- front-end: head only -----------------------------------------------------
  - pull: "{{ webui_image }}"
    hosts: head
  - pull: "{{ caddy_image }}"
    hosts: head
  - pull: "{{ prometheus_image }}"
    hosts: head
  - pull: "{{ grafana_image }}"
    hosts: head
  # --- exporters: every node ----------------------------------------------------
  - pull: "{{ node_exporter_image }}"
  - pull: "{{ nvidia_exporter_image }}"

# Host paths
vllm_models_dir: /opt/vllm/models
nccl_conf_path: /opt/vllm/nccl-env.conf

# Persistent per-engine boot sentinel dir (ADR-0009 fail-safe boot). A marker
# {{ vllm_state_dir }}/vllm-<engine>.running is touched at start and removed on
# any CLEAN stop (systemd ExecStopPost). If it survives to the next boot — the
# only way that happens is an unclean shutdown: a hang / hard-reset / power cut —
# the unit's ConditionPathExists skips auto-start, so the node boots empty and
# reachable instead of re-attempting the risky load unattended. Must be on
# persistent disk (NOT /run or /tmp, which are cleared on boot).
vllm_state_dir: /opt/vllm/state

# --- deploy / activate split (ADR-0018) --------------------------------------
# `deploy` (this playbook, human, password-gated) renders ONE env file per
# allowlisted engine into {{ vllm_engines_dir }} and installs a single systemd
# TEMPLATE unit (vllm@.service). `activate` (unprivileged, agent-drivable) writes
# a desired profile and runs the fixed reconciler, which writes the PER-NODE
# desired markers in {{ vllm_active_dir }} and drives systemd to match.
#
# A unit boots iff  desired (marker in {{ vllm_active_dir }})  AND  cleanly
# stopped last time (no marker in {{ vllm_state_dir }}) — two ConditionPathExists
# gates, so boot never depends on the reconciler existing.
vllm_engines_dir: /opt/vllm/engines
vllm_active_dir: /opt/vllm/active
# The activatable-profile allowlist the reconciler re-validates every request
# against (one profile name per line; `blocked: true` profiles are excluded —
# their weights and env files are kept, but they cannot be activated).
vllm_allowlist_file: "{{ vllm_engines_dir }}/allowlist"

# The reconciler: a small, fixed, root-owned ONESHOT script (not a daemon).
# Invoked through two bounded triggers — a single-command sudoers entry locally,
# and forced-command SSH cross-node. See roles/activate.
activate_bin: /usr/local/sbin/vllm-activate
idle_bin: /usr/local/sbin/vllm-idle
# The second bounded grant (ADR-0019): read-only introspection of a DEPLOYED image.
# Same shape as the reconciler — one fixed program, validated input, no docker grant.
probe_bin: /usr/local/sbin/vllm-probe
probe_image_allowlist: /opt/vllm/images/allowlist
# The third bounded grant (ADR-0021), and the only one that exists for LIFETIME rather
# than privilege: a runbook run needs no root, but it must not be a child of the control
# panel's cgroup, or the next deploy kills a three-hour campaign. Same shape again — one
# fixed program, one allowlisted name, everything else composed from constants.
runbook_bin: /usr/local/sbin/vllm-runbook
runbook_unit: sparky-runbook.service
activate_conf: /opt/vllm/activate.conf
# The dedicated LOW-PRIVILEGE activation identity (the control panel service and
# the agent). It holds the two trigger grants and nothing else — no sudo beyond
# {{ activate_bin }}, no docker group, no ansible. `activate_group` also carries
# geoff, so `./sparky.sh activate` needs no password.
activate_user: activator
activate_group: activate
activate_ssh_key: "/home/{{ activate_user }}/.ssh/id_ed25519"
# The activation REQUEST: group-writable, written with no sudo at all.
desired_profile_file: /opt/cluster/desired-profile
idle_state_file: /opt/cluster/idle-state.json
last_serving_file: /opt/cluster/last-serving-profile
# What `deploy` provisioned (the allowlist, per-node engines + weights). Read by
# the control panel and agents; the counterpart of current-topology.json ("what is
# live"), which the reconciler writes.
fleet_state_file: /opt/cluster/fleet.json

# The stable, model-agnostic served name every engine ALSO advertises (vLLM takes
# several `--served-model-name` values). Chat targets this; bench/eval target the
# engine's real `served_as`. Makes conversations portable across activations.
stable_model_name: sparky
# The one well-known front port. At most ONE live engine per port fleet-wide (the
# reconciler stops-then-starts), which is what lets Caddy carry a STATIC
# health-checked upstream list and follow activation with no config rewrite.
# The fleet role asserts every engine declares this port.
vllm_api_port: 8000

# --- scale to zero -----------------------------------------------------------------
# A loaded-but-idle model is not free: measured 2026-08-12, it costs ~15.5 W fleet-wide
# (both GPUs pinned at ~2400 MHz SM clock against 208 MHz truly idle, at 0.5% utilisation)
# and holds `gpu_memory_utilization` worth of RAM — ~97 GiB on each node — whether or not
# anything is asking it a question. On a box shared with other workloads that is the
# dominant cost of leaving the cluster "on".
#
# So the fleet unloads itself after a long quiet period. TWO deliberate limits:
#
#  * The only thing the timer may do is activate `empty` — the fail-safe target, where the
#    cluster already goes on any failure. It cannot choose or start a model, so the
#    autonomous action can only ever move TOWARD the safe state.
#  * Waking is a human act, through the panel or `./sparky.sh activate`. An unauthenticated
#    request must never cause an activation; that is the load-bearing half of ADR-0018's
#    "no web-API path to root", and it is why there is no /wake endpoint.
#
# The client-side courtesy lives in the Caddyfile (`lb_try_duration`): a request arriving
# while nothing serves is HELD rather than refused, so the caller sees its normal wait UI
# and then the real answer, once someone activates.
idle_unload_enabled: true         # opt-in: a deploy must not start unloading by surprise
idle_unload_after: 14400          # seconds of quiet before unloading (4 h). Hours, not
                                  # minutes: it must survive a lunch, an afternoon of
                                  # meetings, a weekend and overnight rather than firing
                                  # between chat turns. The first request after it fires
                                  # costs a cold start (~5 min on the fastest model,
                                  # ~10 on the slowest), so the threshold is what keeps
                                  # that rare. 0 disables entirely.
# Wake is IMPLICIT: with the fleet at zero, Caddy holds an inference request and this
# manager sees it as an in-flight request and restores what was last serving. No endpoint
# and nothing invocable — it reads a counter. Restore-only: the profile name comes from a
# file WE wrote when WE unloaded, so a caller can resume what the cluster was already
# doing but can never choose a model, start one that was not running, or name a profile.
# Implicit wake. With the fleet at zero, Caddy HOLDS an inference request on the model
# listener (ADR-0022 part 4); the manager counts in-flight requests THERE — a listener
# nothing else can reach — and restores what it unloaded. No endpoint, nothing invocable.
#
# The first attempt counted in-flight across all of :80 and was meaningless: the metric
# carries {handler, server} and no host or path, so it lumped in Open WebUI's long-lived
# websockets and read 3 with nothing waiting (2026-08-13). The separate listener is what
# makes the question answerable rather than a heuristic.
#
# RESTORE, NEVER SELECT: the profile comes from a marker the manager wrote when IT
# unloaded, so a request can resume what the cluster was already doing and can never
# choose a model.
idle_wake_enabled: true
caddy_metrics_url: http://127.0.0.1:2019/metrics
caddy_config_url: http://127.0.0.1:2019/config/apps/http/servers
# How often the manager looks. This is now WAKE LATENCY as well as sleep granularity: a
# held request waits up to this long before anything notices it, on top of the cold start.
# Keep it short -- the check is two local HTTP gets. PRODUCTION: 1min
idle_check_interval: 1min
idle_check_jitter: 0              # NOT the usual 60. Jitter exists to keep periodic jobs
                                  # off the same second, which matters on a busy host with
                                  # many timers; here there is one, and any jitter is added
                                  # directly to how long a caller waits to be noticed.
# How long Caddy holds a request while no upstream is healthy.
#
# SIZE THIS AGAINST COLD-START-TO-SERVING, NOT WEIGHT-LOAD TIME. The first cut used 300s,
# reasoning from qwen3.6's 84 s weight load. Measured end to end on 2026-08-13, a request
# sent to an empty fleet was held **295.8 s** before the engine answered — four seconds
# inside the limit, on the FASTEST model we have. Weight load is only the first phase;
# CUDA graph capture and startup take several minutes more, and `sparky status` calls all
# of it "loading weights".
#
# Observed activate-to-serving: qwen3.6 ~295 s. qwen3-vl-235b's weight load ALONE is 494 s
# (full activation 12 min), so anything under ~600 s silently fails to cover the fleet.
# 600s matches `response_header_timeout` below, so the two phases of waiting are equal.
#
# Most clients give up before this anyway — that is fine and is their choice to make. The
# point is that Caddy is not the thing that gives up first.
model_endpoint_wait: 600s
# Loopback port for the model listener (ADR-0022 part 4). Its own listen address is what
# gives it its own Caddy `server` label, which is what makes in-flight requests there mean
# exactly one thing: a caller waiting for a model.
model_inner_port: 8090
# The outer hop must outlast the inner hold plus the engine's own response, or the public
# vhost becomes the thing that gives up first and the holding buys nothing.
model_endpoint_wait_total: 900s
# The fixed model endpoint Open WebUI + Prometheus point at, configured once at
# deploy time. Caddy resolves it to whichever node is currently serving.
model_endpoint_host: "api.{{ web_domain }}"
model_endpoint_url: "http://api.{{ web_domain }}"

# Convergent weight removal: a model no longer in the allowlist is EVICTED from
# the nodes that held it. Plan-by-default (deploy prints what it would delete);
# pass `-e evict_weights=true` (`./sparky.sh deploy --evict`) to actually delete.
evict_weights: false

# Service identity that owns the weights (not the deploy automation user)
vllm_user: vllm
vllm_group: vllm

# Download inbox for new model weights (head/control node only). `./sparky.sh download`
# (scripts/download.py) stages into {{ model_cache_dir }}/<MODEL>; the model role MOVES it
# into the canonical store ({{ vllm_models_dir }}) on the head, then rsync-mirrors to each
# node **the models that node actually runs** (ADR-0018) — per-node disk tracks its own
# workload, not the whole fleet. The head keeps every allowlisted model: it is the mirror
# SOURCE, so evicting a worker-only model here would leave no way to repair that worker's
# copy short of re-downloading. The inbox is transient (emptied on deploy) and workers are
# pure mirrors — no manual cross-node copy. See roles/model.
model_cache_dir: /opt/cluster/model-cache

# Multi-node rendezvous (vLLM 0.19 native multinode, no Ray) is per-engine:
# each engine's master_addr is computed from its first node's vllm_host_ip and baked
# into that engine's rendered env file (roles/vllm/templates/engine.env.j2). Default
# master port (29500) is used implicitly. Nothing to set globally here.

# Docker run / systemd memory knobs shared by all engines.
#
# THESE ARE A GUARD RAIL AGAINST DEF-0004, and until 2026-08-11 they were set above the
# cliff they were supposed to stop anyone falling off. The box has **121.7 GiB** total;
# the values were `--memory=120g` (leaving 1.7 GiB for the entire rest of the OS) and
# `MemoryMax=124G` (**larger than physical RAM**). Neither could fire before the host
# died — which is exactly what happened when a Marlin-MoE weight load exhausted host RAM
# and hard-froze sparky, needing a power cycle rather than failing the unit.
#
# MEASURED ON A LIVE ENGINE, and the measurement is why these are two different numbers:
#
#   * `MemoryMax` is on the SYSTEMD UNIT's cgroup, and the engine is not in it. ExecStart
#     is `docker run`, so the container is a child of **dockerd**; the unit's cgroup holds
#     one process using ~12 MB — the docker CLIENT. `MemoryMax` has therefore never
#     bounded an engine, and `OOMPolicy=stop` next to it reads as protection that is not
#     there. It is kept, deliberately ABOVE the container cap, so that if placement ever
#     changes (a docker upgrade, `--cgroup-parent`, podman) it cannot become the thing
#     that surprise-kills a healthy engine. The container cap is the real one.
#
#   * `--memory` IS effective — but on GB10 it bounds less than it looks like. That
#     container cgroup reported `memory.current` of **4.7 GiB while the model held ~90
#     GiB**: unified-memory GPU allocations are not charged to the cgroup at all. So this
#     caps HOST-side allocation only.
#
# Which is still the right cap for the failure we actually had: DEF-0004 died at
# `Loading safetensors … 0/27`, i.e. host-side read buffers, not device memory. Page cache
# is charged here too but is reclaimable, so a large weight read reclaims rather than OOMs.
# 105g leaves ~16 GiB for the host while clearing our engines' real host-side use by an
# enormous margin (steady state ~5 GiB; `gpu_memory_utilization` 0.75–0.80 lives on the
# GPU side of the accounting and is untouched by this).
#
# **This is a partial mitigation, not immunity** — it converts a host-RAM runaway from a
# power cycle into a failed unit, and does nothing about device-side ballooning. The real
# fix is upstream: vLLM 0.26.0 bounds the Marlin FP4 MoE repack peak (see DEF-0004).
vllm_shm_size: 32g
vllm_container_memory: 105g
vllm_systemd_memory_max: 110G
# One TEMPLATE unit (ADR-0018) means these are cluster constants, not per-rank
# values. RestartSec suits the worker (it retries the rendezvous until the head is
# up); the head rarely fails fast — waiting on a peer blocks inside
# TimeoutStartSec, which is sized for a full multi-node weight load.
vllm_restart_sec: 20
vllm_start_timeout_sec: 1200

# Ollama: the role was removed by ADR-0018 — `deploy` is whole-fleet and no longer has
# a per-profile serving topology for an Ollama engine to project from, and no profile
# had declared one since the role was built. It was GPU-verified on GB10/sm_121
# (CUDA v13, 100% offload, co-resident with vLLM); recover it from git history if an
# Ollama engine is ever wanted, and give it the same env-file + template-unit shape the
# vLLM engines now have. teardown.yml still sweeps any leftover `ollama-*` unit.

# Metrics stack (P2) — see docs/control-interface.md. Exporters run on every node;
# Prometheus + Grafana on the head. (GB10 reports no GPU memory via nvidia-smi —
# that's the unified memory, covered by node-exporter.)
exporters_dir: /opt/exporters
node_exporter_image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0  # :v1.12.1
node_exporter_port: 9100
# HELD BACK at 1.2.0 while everything else moved (2026-08-08). 1.13.1 is available —
# eleven minors on — but this image carries a GB10 workaround (nvidia_exporter_query_fields
# below) and `--query-field-names` no longer appears in the project's README, so the flag
# may be renamed or gone. Bumping blind risks a crash-looping exporter, and a silently
# absent GPU dashboard is a bad thing to introduce during a container campaign.
# Tracked as DEF-0009; needs its own check, not a batch bump.
nvidia_exporter_image: utkuozdemir/nvidia_gpu_exporter@sha256:cc407f77ab017101ce233a0185875ebc75d2a0911381741b20ad91f695e488c7  # :1.2.0
nvidia_exporter_port: 9835
# Pin query fields: GB10's nvidia-smi exposes clocks_event_reasons_* "[us]" fields
# that the exporter turns into invalid Prometheus metric names and crashes on.
# Querying an explicit safe set avoids that (GPU memory is N/A on GB10 anyway).
nvidia_exporter_query_fields: "utilization.gpu,temperature.gpu,power.draw,clocks.current.sm,clocks.current.memory"
prometheus_image: prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69  # :v3.13.2
prometheus_dir: /opt/prometheus
prometheus_port: 9090
grafana_image: grafana/grafana@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43  # :13.1.3
grafana_dir: /opt/grafana
grafana_port: 3000

# Open WebUI front-end (sparky, host networking). Its connections (OpenAI/Ollama
# endpoints) are generated from the profile's serving_topology by the open-webui
# role — no per-endpoint var here. Kept here (not role defaults) so teardown.yml
# can reach them too. Binds an INTERNAL port (8080) — Caddy fronts it at
# chat.{{ web_domain }}.
webui_image: ghcr.io/open-webui/open-webui@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228  # :v0.11.0
webui_install_dir: /opt/open-webui
webui_port: 8080
# Sent as the API key for every vLLM engine endpoint (vLLM ignores it).
webui_api_key: sk-local
# Auth. First account = admin (done). Signup is CLOSED — the admin allocates
# accounts in Admin Panel → Users; new accounts default to the "user" role.
# The open-webui role sets ENABLE_PERSISTENT_CONFIG=false, so every value here is
# authoritative on every start (config-as-code; see README "Known Shortcomings").
# For a from-scratch install, temporarily set webui_enable_signup "true" to create
# the first admin, deploy, then set it back to "false" and deploy again. (User
# accounts persist as data regardless.)
webui_auth: "true"
webui_enable_signup: "false"
webui_default_user_role: "user"

# Reverse proxy (Caddy) on :80. Landing page at the head host ({{ web_domain }});
# each service is a subdomain (<svc>.{{ web_domain }}). Needs wildcard DNS
# *.{{ web_domain }} -> sparky's IP (one record, then services are proxy-only).
web_domain: sparky.flummoxed.net
caddy_image: caddy@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9  # :2.11.4
caddy_dir: /opt/caddy
# /admin basic_auth (ADR-0008's seam, TURNED ON by ADR-0018 — the panel is now
# deliberately agent-drivable and holds the activation grant, so it can't stay
# open). The hash is a RUNTIME secret, never in git: generate it once with
# `./sparky.sh admin-password`, which writes this file on the head.
caddy_admin_hash_file: /opt/cluster/admin-basic-auth.hash
admin_basic_auth_user: admin

# Control panel (status + activation) — see docs/control-interface.md.
# Runs on-host as User={{ activate_user }} (ADR-0018 took it OFF the `deploy`
# identity: no web-API path to root), bound to 127.0.0.1; Caddy fronts it at
# /admin behind basic_auth. Its only privileged action is `activate`, and that
# runs through the fixed reconciler, never ansible.
control_panel_dir: /opt/cluster/control-panel
control_panel_port: 8088

# The harness, INSTALLED rather than merely published (ADR-0021). `/opt/cluster/sparky`
# is source; nothing on the box can resolve its dependencies, so a detached runbook run
# had nothing to execute. This venv is that interpreter — the same treatment the control
# panel already gets, and for the same reason.
harness_dir: /opt/cluster/harness
harness_src: /opt/cluster/sparky
harness_bin: /opt/cluster/harness/bin/sparky
# What may be INSTANCED, as opposed to what the repo declares. Published by `deploy`,
# writable only by the `cluster` group — the activation identity must never be able to
# add to the list of things it is allowed to run.
runbook_dir: /opt/cluster/runbooks
runbook_log_dir: /opt/cluster/runbook-logs
# The trend store (ADR-0012). Everything a regiment records lands here, and both the
# operator and a detached run write it — hence the `activate`-group grant in the
# `harness` role rather than the `cluster` ownership the rest of /opt/cluster carries.
benchmark_dir: /opt/cluster/benchmark
# The fallback selection when nothing has been activated yet. (`cluster_ansible_dir`
# went with ADR-0018: the panel no longer runs ansible, so nothing but `sparky deploy`
# needs to know where the published tree lives.)
cluster_profile: empty
# What IS running. Written by the RECONCILER when an activation lands (ADR-0018) —
# `deploy` no longer knows what is serving, so it can't be the author. The control
# panel and the harness read it. Its counterpart is {{ fleet_state_file }} (what MAY
# run, deploy-written). See docs/serving-topology.md.
cluster_topology_file: /opt/cluster/current-topology.json
# Activation-gate breadcrumb: `./sparky.sh activate` runs the smoke gate after the
# reconciler returns and records the result here (per-engine ready/tool-shape/quality
# + overall ok, with a timestamp) — written pass OR fail. The reconciler DELETES it at
# the start of every activation, so a stale breadcrumb can never be mistaken for a
# result about the live model. See docs/control-interface.md.
cluster_smoke_report: /opt/cluster/last-smoke.json

# Links shown on the landing page (sparky.flummoxed.net/).
landing_services:
  - name: Open WebUI
    url: "http://chat.{{ web_domain }}"
    blurb: "Chat with the cluster's served model"
  - name: Metrics
    url: "http://metrics.{{ web_domain }}"
    blurb: "Grafana dashboards — throughput, GPU, latency"
  # Open, unlike /admin: this is measurement, not control. Grafana answers "how is the
  # live model doing right now"; the scoreboard answers "which model should be serving",
  # which is not a time series and has no home in Grafana.
  - name: Scoreboard
    url: "/scoreboard"
    blurb: "Every model side by side — accuracy, speed, context, nodes used"
  # LAST, deliberately. Everything above is something you read; this is the one thing that
  # changes the cluster, and it is the only entry behind basic_auth. Ordering the list by
  # what a visitor is most likely to want puts the destructive door at the bottom.
  - name: Admin
    url: "/admin"
    blurb: "Cluster control panel — status, activate, runbooks"
