---
# Infrastructure constants — the same across every profile. Profile files
# (profiles/*.yml) layer the per-deployment choices (model, TP, flags) on top.

# Container runtime — the cluster DEFAULT image, overridable per profile. Built for
# GB10 / SM12.1 (see CLAUDE.md). A profile may set its own `vllm_image` in the profile
# YAML (extra-vars outrank group_vars), so different models can run different containers
# on the same cluster. Update on both nodes, digests must match.
#
# Default 26.04 (vLLM 0.19, NCCL 2.29.7) is the stable, known-good image. AWQ /
# compressed-tensors MoE models (minimax, step-3.5) MUST stay here — 26.06 hangs loading
# them (Marlin-MoE load bug on sm_121). 26.06 (needed for NVFP4) is opt-in per profile:
# profiles/step-3.7-nvfp4.yml pins it. Full story + WAR register + fail-safe boot (ADR-0009):
# docs/upgrades/container-nvidia-vllm-26.06-py3.md.
vllm_image: nvcr.io/nvidia/vllm:26.04-py3

# Host paths
vllm_models_dir: /opt/vllm/models
nccl_conf_path: /opt/vllm/nccl-env.conf

# Persistent per-engine boot sentinel dir (ADR-0009 fail-safe boot). A marker
# {{ vllm_state_dir }}/vllm-<engine>.running is touched at start and removed on
# any CLEAN stop (systemd ExecStopPost). If it survives to the next boot — the
# only way that happens is an unclean shutdown: a hang / hard-reset / power cut —
# the unit's ConditionPathExists skips auto-start, so the node boots empty and
# reachable instead of re-attempting the risky load unattended. Must be on
# persistent disk (NOT /run or /tmp, which are cleared on boot).
vllm_state_dir: /opt/vllm/state

# Service identity that owns the weights (not the deploy automation user)
vllm_user: vllm
vllm_group: vllm

# Download inbox for new model weights (head/control node only). `./sparky.sh download`
# (scripts/download.py) stages into {{ model_cache_dir }}/<MODEL>; the model role MOVES it into the canonical
# store ({{ vllm_models_dir }}) on the head, then rsync-mirrors the whole store to
# every other node. The inbox is transient (emptied on deploy) and snoopy is a
# pure mirror — no manual cross-node copy. See roles/model.
model_cache_dir: /opt/cluster/model-cache

# Multi-node rendezvous (vLLM 0.19 native multinode, no Ray) is per-engine:
# each engine's master_addr is computed from its first node's vllm_host_ip
# (see roles/vllm/templates/vllm.service.j2). Default master port (29500) is
# used implicitly. Nothing to set globally here.

# Docker run / systemd memory knobs shared by all engines.
vllm_shm_size: 32g
vllm_container_memory: 120g
vllm_systemd_memory_max: 124G

# Ollama (per-node standalone engines — see roles/ollama + docs/serving-topology.md).
# Verified on GB10/sm_121 with --gpus all --cgroupns=host (CUDA v13, 100% offload,
# co-resides with vLLM). One ollama engine = one server on one node; multiple on
# the same node need distinct ports.
ollama_image: ollama/ollama:latest
ollama_data_dir: /opt/ollama          # per-engine model cache: {{ ollama_data_dir }}/<engine>
ollama_keep_alive: "5m"               # idle-unload models → frees the GPU
# Cap the context: Ollama's vram-based default is computed from TOTAL unified
# memory (huge) and would OOM a GPU shared with vLLM. Override per engine if needed.
ollama_context_length: 8192

# Metrics stack (P2) — see docs/control-interface.md. Exporters run on every node;
# Prometheus + Grafana on the head. (GB10 reports no GPU memory via nvidia-smi —
# that's the unified memory, covered by node-exporter.)
exporters_dir: /opt/exporters
node_exporter_image: prom/node-exporter:latest
node_exporter_port: 9100
nvidia_exporter_image: utkuozdemir/nvidia_gpu_exporter:1.2.0
nvidia_exporter_port: 9835
# Pin query fields: GB10's nvidia-smi exposes clocks_event_reasons_* "[us]" fields
# that the exporter turns into invalid Prometheus metric names and crashes on.
# Querying an explicit safe set avoids that (GPU memory is N/A on GB10 anyway).
nvidia_exporter_query_fields: "utilization.gpu,temperature.gpu,power.draw,clocks.current.sm,clocks.current.memory"
prometheus_image: prom/prometheus:latest
prometheus_dir: /opt/prometheus
prometheus_port: 9090
grafana_image: grafana/grafana:latest
grafana_dir: /opt/grafana
grafana_port: 3000

# Open WebUI front-end (sparky, host networking). Its connections (OpenAI/Ollama
# endpoints) are generated from the profile's serving_topology by the open-webui
# role — no per-endpoint var here. Kept here (not role defaults) so teardown.yml
# can reach them too. Binds an INTERNAL port (8080) — Caddy fronts it at
# chat.{{ web_domain }}.
webui_image: ghcr.io/open-webui/open-webui:latest
webui_install_dir: /opt/open-webui
webui_port: 8080
# Sent as the API key for every vLLM engine endpoint (vLLM ignores it).
webui_api_key: sk-local
# Auth. First account = admin (done). Signup is CLOSED — the admin allocates
# accounts in Admin Panel → Users; new accounts default to the "user" role.
# The open-webui role sets ENABLE_PERSISTENT_CONFIG=false, so every value here is
# authoritative on every start (config-as-code; see README "Known Shortcomings").
# For a from-scratch install, temporarily set webui_enable_signup "true" to create
# the first admin, deploy, then set it back to "false" and deploy again. (User
# accounts persist as data regardless.)
webui_auth: "true"
webui_enable_signup: "false"
webui_default_user_role: "user"

# Reverse proxy (Caddy) on :80. Landing page at the head host ({{ web_domain }});
# each service is a subdomain (<svc>.{{ web_domain }}). Needs wildcard DNS
# *.{{ web_domain }} -> sparky's IP (one record, then services are proxy-only).
web_domain: sparky.flummoxed.net
caddy_image: caddy:2
caddy_dir: /opt/caddy

# Control panel (status + control actions) — see docs/control-interface.md.
# Runs on-host as User=deploy, bound to 127.0.0.1; Caddy fronts it at /admin.
control_panel_dir: /opt/cluster/control-panel
control_panel_port: 8088
# The published (live) playbook tree the panel runs actions from, and the profile
# its deploy/teardown actions target. (cluster_ansible_dir mirrors the Makefile's
# LIVE; cluster_profile is the panel's default — profile switching is future work.)
cluster_ansible_dir: /opt/cluster/ansible
cluster_profile: step-3.5-fp8
# Live serving-topology state file: the topology-state role writes it at the end of
# a deploy (and teardown clears it); the control panel reads it for topology-aware
# status + per-engine actions. See docs/serving-topology.md (T5).
cluster_topology_file: /opt/cluster/current-topology.json

# Links shown on the landing page (sparky.flummoxed.net/).
landing_services:
  - name: Open WebUI
    url: "http://chat.{{ web_domain }}"
    blurb: "Chat with the cluster's served model"
  - name: Admin
    url: "/admin"
    blurb: "Cluster control panel (status)"
  - name: Metrics
    url: "http://metrics.{{ web_domain }}"
    blurb: "Grafana dashboards — throughput, GPU, latency"
