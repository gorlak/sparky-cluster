---
# Bare cluster — nothing serving on either node. Both GPUs and the bulk of each
# node's RAM are free for: (a) Geoff's day-job/dev work, or (b) using cloud AI
# (Claude, etc.) where Open WebUI / direct API access is plenty.
#
#   ./sparky.sh activate empty
#
# `empty` is also the **fail-safe target** (ADR-0018): any uncertainty — an
# unreadable request, an unknown profile, a node that fails to reconcile — lands
# here rather than guessing a model onto the GPU. It is always activatable, even
# if the allowlist file is missing, so recovery never depends on a file being right.
#
# `serving_topology: []` is the signal: it declares no engines, so activating it
# stops every engine fleet-wide and clears every desired marker. Nothing is
# uninstalled — the weights, env files, and enabled units all stay, so the next
# activation is just a start.
#
# Infrastructure (Caddy, control panel, Open WebUI, Prometheus, Grafana, node/GPU
# exporters) stays up regardless of what's activated — it is deploy-time, not
# profile-driven, so the cluster remains observable and reachable through /admin
# and the metrics dashboards.

profile_name: empty
# What this profile is an EXAMPLE OF, so tests can bind to the SHAPE rather than
# to this model's name (sparky/topology.py: ARCHETYPES).
archetypes: [fail-safe]
serving_topology: []
