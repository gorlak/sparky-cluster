---
# Bare cluster — no local vLLM or Ollama engines on either node. Both GPUs and the
# bulk of each node's RAM are free for: (a) Geoff's day-job/dev work, or (b) using
# cloud AI (Claude, etc.) where Open WebUI / direct API access is plenty.
#
# `serving_topology: []` is the signal: the model role mirror is a no-op (weights
# stay on disk); the vllm + ollama roles prune EVERY managed unit on both nodes
# (strict `vllm-*` / `ollama-*` namespace — nothing else is touched); Open WebUI's
# compose re-templates with no `OPENAI_API_BASE_URLS` / `OLLAMA_BASE_URLS` (i.e.
# ENABLE_*_API=false), so the UI starts clean rather than pointing at dead URLs
# from a previous profile.
#
# Infrastructure (Caddy, control panel, Prometheus, Grafana, node/GPU exporters)
# stays up — the cluster remains observable and reachable through /admin and the
# metrics dashboards. Use this when you want the hardware mostly to yourself.

profile_name: empty
serving_topology: []

enable_open_webui: true       # kept up so its compose re-templates cleanly (empty URLs)
enable_reverse_proxy: true
enable_control_panel: true
enable_metrics: true
