---
# Profile: qwen3-coder-nvfp4-single — Qwen3-Coder-Next (NVFP4) on snoopy only.
# Sparky is free for workstation-driven dev; snoopy serves one coder endpoint.
#
# The engine here is byte-identical to qwen3-coder-nvfp4-dual's qwen3-coder-snoopy
# entry (same name, served_as, flags). Effect: switching single <-> dual only
# adds/removes the sparky engine — snoopy keeps serving without a restart (the
# vllm role only restarts a unit when its rendered content actually changes).
#
# See qwen3-coder-nvfp4-dual.yml for the memory math and the "why per-node, not
# TP=2" rationale. Requires the 26.06 container (NVFP4).

profile_name: qwen3-coder-nvfp4-single
vllm_image: dgx-spark/vllm:26.06-fastapi-fix
serving_topology:
  - name: qwen3-coder-snoopy
    kind: vllm
    nodes: [snoopy]
    port: 8000
    model: Qwen3-Coder-Next-NVFP4
    served_as: qwen3-coder-snoopy
    tensor_parallel_size: 1
    gpu_memory_utilization: "0.55"
    max_model_len: 262144        # matches qwen3-coder-nvfp4-dual's snoopy byte-for-byte
    head_extra_args:
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser qwen3_coder
    worker_extra_args: []

enable_open_webui: true
enable_reverse_proxy: true
enable_control_panel: true
enable_metrics: true
