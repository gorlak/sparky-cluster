---
# MiniMax-M2.7, NVFP4 quant — TP=2 across both nodes.
#
# Memory at gmu 0.80: ~140 GiB disk -> ~70 GiB/node; 96.8 GiB budget - 70 weights - ~0.65
# graphs -> ~26 GiB KV/rank (1-2 long-context seqs at 128k), ~24 GiB/node left for system
# and dev. Drop to 0.75 for dev room, raise to 0.85 for KV.
#
# NEVER pass `--quantization`: modelopt checkpoints are auto-detected and forcing it
# double-quantizes into garbage. `modeling_minimax_m2.py` needs the global
# `--trust-remote-code`.

# ONE NAME. profile == engine == served_as == the lowercased canonical HF model
# name, so the scoreboard, the systemd unit, the API and huggingface.co all agree.
# `hf_repo` is the exact upstream id for eyeball-matching against the Hub.
profile_name: minimax-m2.7-nvfp4
hf_repo: nvidia/MiniMax-M2.7-NVFP4
# What this profile is an EXAMPLE OF, so tests can bind to the SHAPE rather than
# to this model's name (sparky/topology.py: ARCHETYPES).
archetypes: [big-shared, tool-calling]
# ON 26.07 (2026-08-08). TP=2 across both nodes — carries the DEF-0002 soak question
# (inference-time CUDA deadlock, 35–55 min in) and is the only TP=2 shape on 26.07.
# (inference deadlock 35-55 min in). Needs a CONCURRENCY soak, not just duration:
# the 90-min light-load soak on 2026-08-06 passed and proved little.
image: dgx-spark/vllm:26.07-xgrammar-fix  # 26.07 + xgrammar WAR (DEF-0010)
serving_topology:
  - name: minimax-m2.7-nvfp4
    kind: vllm
    model: MiniMax-M2.7-NVFP4
    served_as: minimax-m2.7-nvfp4
    # gmu 0.80 -> 0.70 (2026-08-30, ADR-0028). At 0.80 minimax measured ~11 GiB idle headroom —
    # right at the ~10-12 GiB floor the qwen3.6 OOM established, and vLLM reserves `gmu x 121`
    # regardless of quant. It ran the regiment clean at 0.80, but the margin is thinner than a
    # sustained heavy-reasoner soak deserves; 0.70 hands ~12 GiB back — measured 23-26 GiB idle at
    # 0.70 (2026-08-30) against the ~11 at 0.80.
    memory_fraction: "0.70"
    # 131072 -> 196608 (2026-08-30) = the model's NATIVE context (`max_position_embeddings`).
    # MiniMax-M2.7 is an EXTREME reasoner — it reasons past the eval's cap on 32% of items, and a
    # 6000-token reply here spent the whole budget thinking with no answer emitted — so a window
    # below native truncates its reasoning+answer outright. Measured 2026-08-30: at gmu 0.70 the KV
    # pool holds 237,936 tokens = ~1.21x this window. Tight, and the deliberate cost of pairing
    # 0.70's host headroom with the native context — the gmu drop came out of KV. Fine for a heavy
    # reasoner served to a few users; gmu 0.75 would buy ~1.45x KV at ~15 GiB headroom if
    # concurrency ever matters (still above the ADR-0028 floor).
    context_length: 196608
    head_extra_args:
      - --enable-chunked-prefill
      - --reasoning-parser deepseek_r1
      - --enable-auto-tool-choice
      - --tool-call-parser minimax_m2
    worker_extra_args:
      - --enable-chunked-prefill

