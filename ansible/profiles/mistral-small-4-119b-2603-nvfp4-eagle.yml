---
# Mistral-Small-4-119B-2603 (NVFP4) — TP=2 across both nodes, container 26.07.
#
# WHY THIS MODEL: the European slot, sourced properly. `mistral-medium-3.5-128b-nvfp4`
# has never served (DEF-0012), and the sweep that followed
# (scouting-reports/2026-08-mistral-sourcing.md) found this is the only Mistral candidate
# whose PACKAGING cannot re-create that class of failure. Newer generation than
# Mistral-Medium-3.5, Apache-2.0 rather than `license: other`, and a third the footprint.
#
# PACKAGING — this is the whole reason it is here. The repo is **pure Mistral-native**:
# `params.json`, `tekken.json`, `consolidated.safetensors.index.json`, and NOTHING ELSE.
# No `config.json`, no `model.safetensors.index.json`. DEF-0012 is a story about two
# loader paths disagreeing — first tokenizer vs config, then config vs weight loader.
# Here there is only one path, so there is nothing to disagree with.
#
# And critically, its `params.json` carries the quant config INLINE:
#   "quantization_config": {"format": "nvfp4-pack-quantized",
#                           "quant_method": "compressed-tensors", ...}
# That is precisely what `nvidia/Mistral-Medium-3.5-128B-NVFP4` lacks — there the quant
# map lives only in the HF `config.json`, so `--config-format mistral` DISCARDS it
# (observed: `quantization=fp8, quantization_config=None`). A native config that carries
# its own quantization cannot lose it. **No `--quantization` flag** either way: the
# checkpoint self-declares, and overriding a self-declaring checkpoint is the standing
# footgun of this cluster.
#
# THE FLAGS TRAVEL AS A TRIO — `--tokenizer-mode` + `--config-format` + `--load-format`,
# all `mistral`, on BOTH ranks (every rank builds its own VllmConfig). Two of three is
# what broke Mistral-Medium. This is NVIDIA's own DGX Spark forum recipe for this exact
# model, quoted verbatim from a working single-node GB10 run:
#   --tokenizer-mode mistral --config-format mistral --load-format mistral
#   --max-model-len 40000 --gpu-memory-utilization 0.75
#   --tool-call-parser mistral --enable-auto-tool-choice
#   VLLM_MLA_DISABLE=1  VLLM_NVFP4_GEMM_BACKEND=marlin
# https://forums.developer.nvidia.com/t/running-mistral-small-4-119b-nvfp4-on-nvidia-dgx-spark-gb10/363863
#
# WHAT WE DELIBERATELY DID *NOT* COPY, and why. That report ran vLLM **0.17.2rc1 built
# from source**, single-node. We are on 0.24.0 (26.07), TP=2. Per [[model-bringup]] the
# rule is start minimal and add only what is provably needed, so both of their env vars
# are LEFT OUT of the first activation — see `engine_env` below for the two that are
# standing by, and read the log before adding either.
#
# ⚠️ THE MARLIN HAZARD — READ BEFORE THE FIRST ACTIVATION.
# This is a **compressed-tensors MoE** (128 experts, 4 active + 1 shared). DEF-0004 is a
# compressed-tensors **Marlin MoE** weight-load failure on sm_121 that did not hang but
# **hard-froze sparky and needed a power cycle**. That defect is WNA16 and this is NVFP4,
# so it is adjacent rather than identical — but the forum recipe pushes this model onto a
# Marlin backend explicitly (`VLLM_NVFP4_GEMM_BACKEND=marlin`), which is the one direction
# DEF-0004 says not to walk casually. So:
#   * FIRST ACTIVATION IS ATTENDED, with nothing else running.
#   * Do NOT set `VLLM_NVFP4_GEMM_BACKEND=marlin` to "fix" a load failure without reading
#     DEF-0004 first. A load that dies is cheap; a node that freezes is a power cycle.
#   * ADR-0009's fail-safe boot gate is verified and held the last time this happened, so
#     the node comes back empty and reachable — that is the safety net, not a licence.
#
# MLA — ✅ **WORKS ON 0.24.0, and this is the profile's biggest win.**
# `kv_lora_rank 256 + qk_rope_head_dim 64 = head_size 320` is exactly the value the GB10
# forum report could not run ("head_size=320 incompatibility"), which forced them onto
# `VLLM_MLA_DISABLE=1` and capped their context at 40k. That was vLLM 0.17.2rc1; **0.24.0
# handles it** — first activation 2026-08-11 came up clean with
#   Using TRITON_MLA attention backend · Using FLASH_ATTN MLA prefill backend
# and neither env var from that recipe was needed. Hence `engine_env: {}` below.
# What it bought: one compressed latent per token instead of full MHA —
#   MLA ON : ~22.5 KiB/token  → **2,392,720 tokens** of cache measured
#   MLA OFF: ~576 KiB/token   → ~25× worse, and their 40k ceiling
# If a future container regresses this, the fallback is `VLLM_MLA_DISABLE: "1"` in
# `engine_env` **and** dropping `max_model_len` to 40960 — the two go together.
#
# MEMORY MATH (gmu 0.75 — big-shared with dev headroom):
#   weights 65 GiB total → ~32.5 GiB/node at TP=2 — the LIGHTEST big-shared profile here
#   gmu 0.75 × 121 = 90.75 GiB/node budget − 32.5 weights − ~1 graphs → ~57 GiB KV/rank
#   With MLA on, ~57 GiB at ~22.5 KiB/token is on the order of 2.5M tokens — far more than
#   any max_model_len we would set. Capacity is not the constraint on this profile;
#   kernel support is.
#
# CONTEXT: 262144 — the vendor's own stated 256k, and their serve recipe uses exactly this
# number. `max_position_embeddings` claims 1,048,576 but that is YaRN factor 128 from an
# original 8192; the card recommends <=200k. See the note on `max_model_len` below.
#
# VISION: ✅ passed the smoke gate's vision probe on first activation (2026-08-11), which
# was not a given — Step-3.7 passed text quality and still produced garbage on vision the
# same day.
#
# MEASURED 2026-08-11 (first activation): weights 33.37 GiB in 119 s · KV **2,392,720
# tokens** · **49.0 tok/s** single-stream · all four smoke columns pass. That is 14x the
# dense `mistral-medium-3.5-128b` it replaced, on ~half the weights — the active-parameter
# arithmetic in [[model-discovery]], demonstrated.
#
# ⛔ CANNOT SERVE ON THIS HARDWARE — closed 2026-08-12 after three attempts. The blocker
# is not configuration and not this profile; it is that **speculative decoding and MLA
# attention have no working decode backend together on sm_121 / vLLM 0.24.0.**
#
# Attempt 1 — OUR BUG, fixed. `--speculative-config` head-only, so the ranks built
# different VllmConfigs and TP=2 deadlocked. `sparky lint` now refuses that whole class
# (`fleet.BOTH_RANK_FLAGS`).
#
# Attempt 2 — vLLM auto-selected `TRITON_MLA` for decode, which is decode-ONLY:
#   assert m.max_query_len <= self.reorder_batch_threshold  # decode only
# Spec-decode submits num_speculative_tokens+1 = 4 query tokens when the target verifies
# a proposal, so the assert fires during cudagraph capture.
#
# Attempt 3 — took Mistral's own fix, `--attention-backend FLASH_ATTN_MLA`, plus the rest
# of their recipe (`--max-num-batched-tokens 16384 --max-num-seqs 128`). The flag parsed
# and the backend resolved, then:
#   ValueError: Selected backend AttentionBackendEnum.FLASH_ATTN_MLA is not valid for
#   this configuration
# FLASH_ATTN MLA works for **prefill** here — the log says so on every activation — but it
# is not a valid **decode** backend on sm_121. So both MLA decode backends are out: one
# forbids multi-token queries, the other does not exist for this configuration.
#
# THE ONLY REMAINING LEVER IS A BAD TRADE. `VLLM_MLA_DISABLE=1` would drop to plain MHA,
# where ordinary decode backends accept spec-decode — at the cost of ~25x the KV per token
# (22.5 KiB -> ~576 KiB) and a context ceiling near 40k instead of 262144. Spending 2.39M
# tokens of cache to chase maybe 1.5-2x on decode is not a trade worth making, and the
# control already serves at 49.5 tok/s.
#
# THE DECISIVE EVIDENCE, found by research after the third failure — and it is one line in
# a log we already had:
#     Using TRITON_MLA attention backend out of potential backends: ['TRITON_MLA']
# vLLM's enum carries SIX MLA backends and all six are present in this build (TRITON_MLA,
# FLASH_ATTN_MLA, FLASHINFER_MLA, FLASHMLA, CUTLASS_MLA, FLASHMLA_SPARSE). For this model
# on sm_121 it considers exactly ONE. So no `--attention-backend` value can help: there is
# nothing else to select, and `FLASHINFER_MLA` — the backend upstream built spec-decode
# support around ([vllm#22684], superseded by [vllm#24539] "Efficient padded speculation",
# where backends opt in via `decode_supports_qlen_padding`) — is simply not available here.
# FlashInfer IS installed (0.6.14, the exact version Mistral's recipe names); availability
# is decided per model and platform, not by the package existing.
#
# CLEARS WHEN: that potential-backends list grows past `['TRITON_MLA']` on a future
# container, **or** TRITON_MLA itself gains qlen padding. Re-test then is one activation —
# everything else in this profile is already correct. Check with the grep in
# docs/bring-up-failures.md before spending it.
#
# PARKED (`blocked: true` below), not deleted. The config is right and the diagnosis cost
# three activations, so the file stays — but leaving it ACTIVATABLE was a mistake I made
# and had to be corrected: the allowlist is not a menu nobody browses, it is what
# `runbooks/all.yml` iterates. An activatable profile that provably cannot serve would
# have burned an hour and quarantined on every run of the standing campaign. Parking keeps
# the weights and the engine files, so the re-test is still one command
# (drop `blocked:`, deploy, activate) the day a container changes. DEF-0016.
#
# THIS IS THE EAGLE ARM. Identical to `mistral-small-4-119b-2603-nvfp4` in every respect
# except the `--speculative-config` below and the `extra_models` that make its draft exist
# on both nodes. The bare-name twin is the CONTROL, and 49.0 tok/s is the number to beat.
# Keep them identical apart from that one difference or the comparison means nothing
# (ADR-0014 — the register decides KEEP or DROP on the measured delta).
#
# EAGLE = a separate 2-layer, 390 MB draft model, NOT a modification of these weights. It
# proposes 3 tokens; the 119B verifies all 3 in ONE forward pass and discards any that do
# not match, so **output is identical to the control** — this is a latency change, not a
# quality trade. It suits this box specifically: decode here is bound by reading 1.65 GB of
# active weights per token, and verifying 3 proposals reads them once instead of 3 times.

# ONE NAME. profile == engine == served_as == the lowercased canonical HF model
# name, so the scoreboard, the systemd unit, the API and huggingface.co all agree.
profile_name: mistral-small-4-119b-2603-nvfp4-eagle

# ⛔ PARKED — DEF-0016. See the header above: no MLA backend on sm_121 accepts
# multi-token decode queries, so speculative decoding cannot run at all here.
blocked: true
hf_repo: mistralai/Mistral-Small-4-119B-2603-NVFP4
# What this profile is an EXAMPLE OF, so tests can bind to the SHAPE rather than
# to this model's name (sparky/topology.py: ARCHETYPES).
archetypes: [big-shared, vision]

# NOT parked. The weights landed in the inbox 2026-08-11 and were verified file-by-file
# against the Hub — 23/23 files, every size exact, no `.incomplete`, 66.0 GiB, and
# `consolidated.safetensors.index.json` present (the native index this profile's
# `--load-format mistral` depends on; `nvidia/Mistral-Medium-3.5-128B-NVFP4` has no such
# index, which is why the same flag may be unrunnable there).
#
# The park-then-unpark dance was skipped deliberately: `deploy` is what MOVES the inbox
# copy to /opt/vllm/models and mirrors it to both nodes, so the deploy that makes this
# activatable is the same one that stages it. Parking would have cost a second
# password-gated deploy to buy nothing — and a human round trip is the scarce resource
# here ([[model-bringup]]: profiles batch, activations serialize).

vllm_image: dgx-spark/vllm:26.07-xgrammar-fix  # 26.07 + xgrammar WAR (DEF-0010)

serving_topology:
  - name: mistral-small-4-119b-2603-nvfp4-eagle
    kind: vllm
    model: Mistral-Small-4-119B-2603-NVFP4  # dir under /opt/vllm/models
    served_as: mistral-small-4-119b-2603-nvfp4-eagle
    gpu_memory_utilization: "0.75"
    # 65536 was the first-bring-up number; raised to the model's stated 256k on
    # 2026-08-11 once the real KV budget was known. It costs nothing: the cache holds
    # **2,392,720 tokens**, so 262144 still leaves ~9 concurrent full-length sequences
    # (it was 36.5x at 65536 — headroom nobody was using).
    # NOT higher: `max_position_embeddings` claims 1,048,576, but that is YaRN factor 128
    # from an original 8192 — the far end of the rope curve, and the model card recommends
    # <=200k. 262144 is the vendor's own stated context, and 1M would buy 2.3 concurrent
    # sequences of mostly-extrapolated attention.
    max_model_len: 262144
    # Deliberately EMPTY for the first activation. The two standing by, both from the
    # forum recipe and neither yet justified on 0.24.0:
    #   VLLM_MLA_DISABLE: "1"              # if it refuses on head_size=320 (then ctx 40960)
    #   VLLM_NVFP4_GEMM_BACKEND: "marlin"  # ⚠️ MoE + Marlin — read DEF-0004 FIRST
    engine_env: {}
    # The EAGLE draft is named inside `--speculative-config`, and a flag is an opaque
    # string to the deploy. Declaring it here is what makes `deploy` move it out of the
    # inbox and mirror it to snoopy; without it the engine would start on sparky and die
    # on the worker with a missing path.
    extra_models:
      - Mistral-Small-4-119B-2603-eagle
    head_extra_args:
      - --enable-chunked-prefill
      # The trio. Two of three is what broke DEF-0012; all three is the proven recipe.
      - --tokenizer-mode mistral
      - --config-format mistral
      - --load-format mistral
      - --enable-auto-tool-choice
      - --tool-call-parser mistral
        # From Mistral's OWN recipe on the draft model's card. Written UNSPACED and UNQUOTED:
        # serve flags travel through the engine env file as one single-quoted value that
        # systemd re-splits on whitespace with no quote processing, so the JSON must carry no
        # spaces and no outer quotes. `model` is the LOCAL path, not the Hub id — the engine
        # has no network. The inner `max_model_len` bounds how far the DRAFT looks; it is not
        # the served context, which stays 262144.
        #
        # `--attention-backend FLASH_ATTN_MLA` is REQUIRED, not a tweak: vLLM auto-selects
        # TRITON_MLA for decode, which is decode-only and asserts
        # `max_query_len <= reorder_batch_threshold`, while spec-decode submits
        # num_speculative_tokens+1 query tokens per sequence at verification. Prefill was
        # already on FLASH_ATTN MLA; only decode fell back. `VLLM_ATTENTION_BACKEND` is gone
        # from `vllm.envs` in 0.24.0, so the flag is the only interface.
        #
        # The two scheduler numbers are from the same recipe and are not optional: the draft's
        # extra token slots need budget, or vLLM caps `max_num_scheduled_tokens` at 2048 and
        # warns of suboptimal performance. Adopt a vendor recipe whole (DEF-0012).
      - --attention-backend FLASH_ATTN_MLA
      - --max-num-batched-tokens 16384
      - --max-num-seqs 128
      - --speculative-config {"model":"/models/Mistral-Small-4-119B-2603-eagle","num_speculative_tokens":3,"method":"eagle","max_model_len":"65536"}
    worker_extra_args:
      - --enable-chunked-prefill
      - --tokenizer-mode mistral
      - --config-format mistral
      - --load-format mistral
      - --speculative-config {"model":"/models/Mistral-Small-4-119B-2603-eagle","num_speculative_tokens":3,"method":"eagle","max_model_len":"65536"}
      - --attention-backend FLASH_ATTN_MLA
      - --max-num-batched-tokens 16384
      - --max-num-seqs 128
