---
# Profile: qwen3.6-35b-nvfp4-single — Qwen3.6-35B-A3B (NVFP4) on snoopy only.
# Sparky free for workstation-driven dev; snoopy serves one reasoning-generalist
# endpoint.
#
# The engine here is byte-identical to qwen3.6-35b-nvfp4-dual's qwen3.6-35b-snoopy
# entry, so switching single <-> dual only adds/removes the sparky engine —
# snoopy keeps serving without a restart.
#
# See qwen3.6-35b-nvfp4-dual.yml for the memory math, the "why per-node not TP=2"
# rationale, and the quant/arch/text-first notes. Requires the 26.06 container.

profile_name: qwen3.6-35b-nvfp4-single
vllm_image: dgx-spark/vllm:26.06-fastapi-fix
serving_topology:
  - name: qwen3.6-35b-snoopy
    kind: vllm
    nodes: [snoopy]
    port: 8000
    model: Qwen3.6-35B-A3B-NVFP4
    served_as: qwen3.6-35b-snoopy
    tensor_parallel_size: 1
    gpu_memory_utilization: "0.55"
    max_model_len: 262144        # matches qwen3.6-35b-nvfp4-dual's snoopy byte-for-byte
    head_extra_args:
      - --enable-chunked-prefill
      - --kv-cache-dtype fp8
      - --enable-auto-tool-choice
      - --tool-call-parser qwen3_xml
      - --reasoning-parser qwen3
    worker_extra_args: []

enable_open_webui: true
enable_reverse_proxy: true
enable_control_panel: true
enable_metrics: true
