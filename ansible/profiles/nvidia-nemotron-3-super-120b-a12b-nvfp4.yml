---
# nvidia-nemotron-3-super-120b-a12b-nvfp4 — NVIDIA Nemotron-3-Super-120B-A12B, big-shared TP=2.
#
# The upstream of `nvidia-nemotron-labs-3-puzzle-75b-a9b-nvfp4`: Puzzle is DERIVED from this model
# (NAS-compressed), so this is the un-compressed original — 120B total / A12B active
# against Puzzle's 75B / A9B, for ~25 GiB more disk. Same NemotronH hybrid family.
#
# WHY IT EARNS A SLOT. Puzzle measured 35.2M KV tokens at TP=2, the largest cache in the
# fleet by 2x, because the architecture barely uses attention: of 88 layers only **8** are
# attention, the rest Mamba (40) and MLP (40). With 2 KV heads at head_dim 128 and an
# FP8 KV cache that is **4 KiB/token**, so context is nearly free. Estimated ~31M KV
# tokens at TP=2 — long-context work is the binding workload here, and this
# family is structurally built for it.
#
# MEMORY MATH (measured from the Hub, not from the model card — skills/model-evaluation).
#   weights          16 x 5.0 GB + 346 MB = ~80.3 GB = **74.8 GiB**
#   TP=2, per node   ~37.4 GiB of 121 usable
#   gmu 0.80         budget ~96.8 GiB/node -> ~59 GiB/node for KV (~118 GiB total)
#   KV at 4 KiB/tok  ~31M tokens, against a 262,144 max_model_len
# It also fits TP=1 (74.8 GiB on one node), but TP=2 is the shape: measured 2026-08-10,
# TP=2 beat TP=1 on decode, throughput AND cache for every model tried.
#
# ⚠️ THE REPO NAME LIES ABOUT THE QUANT, again (skills/model-bringup). Despite `-NVFP4`:
#     quant_algo: MIXED_PRECISION        <- FP8 *and* NVFP4 layers, not pure NVFP4
#     kv_cache_quant_algo: FP8           <- declares its own KV dtype
#     quant_method: modelopt
# So: **never pass `--quantization`** — the checkpoint self-declares, and overriding it
# is the double-quantization bug that produces multilingual garbage (README). FP8 KV is
# auto-enabled from the checkpoint; we do not set `--kv-cache-dtype`. This is the same
# shape as `mistral-medium-3.5-128b-nvfp4`, which serves fine on `modelopt_mixed`.
#
# PARSERS — read, not guessed (a guessed name is a refusal to start):
#   tool: `chat_template.jinja` emits `<tool_call><function=NAME><parameter=KEY>value
#         </parameter></function></tool_call>` — byte-identical in shape to Puzzle's, so
#         **qwen3_coder**, which is proven on this image by `qwen3-coder-next-nvfp4`.
#   reasoning: the model ships `super_v3_reasoning_parser.py`, but it is
#         `class SuperV3ReasoningParser(DeepSeekR1ReasoningParser)` — a SUBCLASS — and the
#         template uses plain `<think>`/`</think>`. So **deepseek_r1** covers it, and that
#         name already serves `minimax-m2.7-nvfp4`. No plugin, no unproven name.
#
# UNVERIFIED UNTIL FIRST ACTIVATION: `NemotronHForCausalLM` probes `true` on 26.07, but
# the arch check only proves vLLM knows the name. Treat the first activation as the test.
# ONE NAME. profile == engine == served_as == the lowercased canonical HF model
# name, so the scoreboard, the systemd unit, the API and huggingface.co all agree.
# `hf_repo` is the exact upstream id for eyeball-matching against the Hub.
#
# MEASURED 2026-08-11, AND KEPT DELIBERATELY DESPITE LOSING.
#   Super  72.1% MMLU-Pro subset (4/140 unparseable) · 24.7 tok/s · TPOT 39.3ms · 27.5M KV
#   Puzzle 70.7%                 (7/140)             · 31.7 tok/s · TPOT 30.8ms · 34.7M KV
# 1.4 points on 140 items is a two-question swing — inside the noise. On every other axis
# its NAS-compressed derivative wins: 29% faster decode, 68% more throughput, 26% more
# cache, 25 GiB less disk. The pre-agreed rule said a tie retires Super.
#
# It is kept anyway, on an explicit and falsifiable bet: **MMLU-Pro cannot see the axis
# that would justify A12B over A9B.** This cluster's operator writes software, and the
# quality regiment measures law, psychology and history. Retiring a model on a benchmark
# blind to the workload is deciding on the wrong evidence.
#
# REVISIT WHEN the coding regiment exists: re-run both and decide on that number. If Super
# does not win there either, it has no argument left and goes. Until then it costs 75 GiB
# and a slot in every sweep — a price paid knowingly, not by neglect.
profile_name: nvidia-nemotron-3-super-120b-a12b-nvfp4
hf_repo: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
# What this profile is an EXAMPLE OF, so tests can bind to the SHAPE rather than
# to this model's name (sparky/topology.py: ARCHETYPES).
archetypes: [big-shared, tool-calling, mixed-precision]
vllm_image: dgx-spark/vllm:26.07-xgrammar-fix  # 26.07 + xgrammar WAR (DEF-0010)
serving_topology:
  - name: nvidia-nemotron-3-super-120b-a12b-nvfp4
    kind: vllm
    model: NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    served_as: nvidia-nemotron-3-super-120b-a12b-nvfp4
    gpu_memory_utilization: "0.80"
    max_model_len: 262144
    head_extra_args:
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser qwen3_coder
      - --reasoning-parser deepseek_r1
    worker_extra_args:
      - --enable-chunked-prefill
