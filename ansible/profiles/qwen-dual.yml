---
# Per-node small-model profile — one Qwen3-30B on each node, both serving
# independently. Establishes the "small models live per-node, no TP" pattern
# (vs. step/minimax which are big-model-shared-via-TP).
#
# Two single-node engines: qwen-sparky (sparky:8000) and qwen-snoopy (snoopy:8000).
# Each has the whole node to itself → gmu 0.85 (102.85 GiB reserved), weights
# ~30 GiB, ~72 GiB for graphs + KV — 32k context is trivially fine. Distinct
# served_as so Open WebUI shows both endpoints separately.
#
# Replaces the older `multi` profile (MiniMax TP=2 + Qwen co-resident on snoopy),
# which hit a rank-asymmetric CUDA-graph KV squeeze inside MiniMax's gmu under
# co-residency (see operational-gotchas #8). Separation of concerns is cleaner.

profile_name: qwen-dual
serving_topology:
  - name: qwen-sparky
    kind: vllm
    nodes: [sparky]
    port: 8000
    model: Qwen3-30B-A3B-Instruct-2507-FP8
    served_as: qwen3-30b-sparky
    tensor_parallel_size: 1
    gpu_memory_utilization: "0.50"
    # "Small-and-dev-friendly": gmu 0.50 → ~60 GiB vLLM budget; weights ~30 GiB +
    # graphs ~1 GiB → ~29 GiB KV. 128k @ ~48 KiB/token = ~6 GiB/seq → 4–5 concurrent
    # long-context sequences fit comfortably. Leaves ~60 GiB free per node for
    # dev/builds. Bump gmu only if you actually need more concurrent capacity.
    # See docs/profile-tuning.md.
    max_model_len: 131072
    head_extra_args:
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser hermes
    worker_extra_args: []

  - name: qwen-snoopy
    kind: vllm
    nodes: [snoopy]
    port: 8000                   # different node, so reusing :8000 is fine
    model: Qwen3-30B-A3B-Instruct-2507-FP8
    served_as: qwen3-30b-snoopy
    tensor_parallel_size: 1
    gpu_memory_utilization: "0.50"
    # "Small-and-dev-friendly": gmu 0.50 → ~60 GiB vLLM budget; weights ~30 GiB +
    # graphs ~1 GiB → ~29 GiB KV. 128k @ ~48 KiB/token = ~6 GiB/seq → 4–5 concurrent
    # long-context sequences fit comfortably. Leaves ~60 GiB free per node for
    # dev/builds. Bump gmu only if you actually need more concurrent capacity.
    # See docs/profile-tuning.md.
    max_model_len: 131072
    head_extra_args:
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser hermes
    worker_extra_args: []

enable_open_webui: true
enable_reverse_proxy: true
enable_control_panel: true
enable_metrics: true
