---
# Profile: qwen3-coder-nvfp4-dual — Qwen3-Coder-Next (NVFP4) per-node, one
# independent engine on each node. Two endpoints: qwen3-coder-sparky and
# qwen3-coder-snoopy. Its snoopy engine is byte-identical to
# qwen3-coder-nvfp4-single, so switching single <-> dual only adds/removes the
# sparky engine (snoopy keeps serving, no restart).
#
# Why per-node and NOT TP=2: this is an 80B linear-attention hybrid (qwen3_next:
# only 12 of 48 layers are full attention -> tiny KV). NVFP4 weights ~45 GiB fit
# comfortably on ONE node. TP=2 across our two Sparks would be a straight loss:
# no NVLink between nodes, so the per-layer all-reduce runs over ConnectX-7 and,
# for a ~3B-active model, decode is bandwidth/latency-bound -> single-stream tok/s
# comes out a wash-to-worse than single-node, while burning both boxes. Per-node
# gives two independent coders and keeps the topology simple. (See the qwen family
# note in docs/profiles.md for the full TP=2 cost analysis.)
#
# Memory math (gmu 0.55 — "small-and-dev-friendly"):
#   gmu 0.55 x 121 = 66.55 GiB vLLM budget/node - ~45 weights - ~1 graphs
#     -> ~20 GiB KV. KV is cheap here (full-attn only, tiny per-token), so ~20 GiB
#     is many concurrent sessions at typical 32-64k context. Leaves ~55 GiB/node
#     for dev/builds. Bump gmu for more concurrency; there's lots of room.
#
# QUANT: NVFP4 compressed-tensors — auto-detected, NO --quantization. Currently
# staged: the RedHatAI/Qwen3-Coder-Next-NVFP4 build (dir Qwen3-Coder-Next-NVFP4).
# Alternative if it misbehaves on GB10: saricles/Qwen3-Coder-Next-NVFP4-GB10
# (quantized for DGX-Spark/GB10 + vLLM). If compressed-tensors won't load on 26.06,
# fall back to the official Qwen/Qwen3-Coder-Next-FP8 (80 GiB, rename family to -fp8).
# qwen3_next is a native arch on 26.06's vLLM (registry-confirmed).

profile_name: qwen3-coder-nvfp4-dual
# NVFP4 needs the 26.06 container. The `images` role builds this patched image on every node (ADR-0013).
vllm_image: dgx-spark/vllm:26.06-fastapi-fix
serving_topology:
  - name: qwen3-coder-sparky
    kind: vllm
    nodes: [sparky]
    port: 8000
    model: Qwen3-Coder-Next-NVFP4
    served_as: qwen3-coder-sparky
    tensor_parallel_size: 1
    gpu_memory_utilization: "0.55"
    max_model_len: 262144
    head_extra_args:
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser qwen3_coder
    worker_extra_args: []

  - name: qwen3-coder-snoopy
    kind: vllm
    nodes: [snoopy]
    port: 8000                   # different node, so reusing :8000 is fine
    model: Qwen3-Coder-Next-NVFP4
    served_as: qwen3-coder-snoopy
    tensor_parallel_size: 1
    gpu_memory_utilization: "0.55"
    max_model_len: 262144
    head_extra_args:
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser qwen3_coder
    worker_extra_args: []

enable_open_webui: true
enable_reverse_proxy: true
enable_control_panel: true
enable_metrics: true
