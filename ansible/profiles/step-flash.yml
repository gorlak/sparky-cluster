---
# Profile: step-flash — the current production deployment.
# Step-3.5-Flash-FP8 served at TP=2 across sparky + snoopy, Open WebUI on :80.
#
# Apply with:  make deploy PROFILE=step-flash
profile_name: step-flash

# Model
model_name: Step-3.5-Flash-FP8
served_model_name: step-3.5-flash

# Topology / serving
multinode: true
num_nodes: 2
tensor_parallel_size: 2
max_model_len: 32768
gpu_memory_utilization: "0.90"

# Extra `vllm serve` flags.
#  - Head runs the API, so it gets the tool/reasoning parsers + auto tool choice.
#  - Worker is headless (no API), so it only needs the compute-side flag.
# NOTE: --kv-cache-dtype fp8 and --enable-prefix-caching are intentionally
# omitted — they caused multi-turn corruption on this model (see CLAUDE.md).
vllm_head_extra_args:
  - --enable-chunked-prefill
  - --enable-auto-tool-choice
  - --tool-call-parser step3p5
  - --reasoning-parser step3p5
vllm_worker_extra_args:
  - --enable-chunked-prefill

# Front-end
enable_open_webui: true
enable_reverse_proxy: true
