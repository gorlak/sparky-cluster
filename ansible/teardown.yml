---
# Stop the cluster and free GPU memory. Discovers every vLLM engine unit on each
# node (vllm.service / vllm-*.service) and stops + disables + removes it — so it
# works regardless of which engines a profile defined. Open WebUI is CPU-only and
# is left running unless you explicitly ask for it:
#
#   make teardown                 # stops all vLLM engines on both nodes
#   ansible-playbook teardown.yml --tags webui   # also stops Open WebUI + Caddy

- name: Stop all vLLM engines (all nodes)
  hosts: all
  tasks:
    - name: Find vLLM unit files
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: ['vllm.service', 'vllm-*.service']
      register: vllm_units

    - name: Stop and disable each vLLM unit
      ansible.builtin.systemd:
        name: "{{ item.path | basename }}"
        state: stopped
        enabled: false
      loop: "{{ vllm_units.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      failed_when: false

    - name: Remove each vLLM container
      ansible.builtin.command: "docker rm -f {{ item.path | basename | regex_replace('\\.service$', '') }}"
      loop: "{{ vllm_units.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: false
      failed_when: false

- name: Stop front-end — Open WebUI + Caddy (only with --tags webui)
  hosts: head
  tags: [never, webui]
  tasks:
    - name: Compose down Open WebUI
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ webui_install_dir }}"
      changed_when: true
      failed_when: false

    - name: Compose down Caddy
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ caddy_dir }}"
      changed_when: true
      failed_when: false
