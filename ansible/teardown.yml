---
# BREAK-GLASS teardown. The normal way to stop serving is `./sparky.sh activate
# empty` — unprivileged, marker-transactional, and it leaves the fleet in a state
# the reconciler and systemd agree on. This playbook is the privileged fallback for
# when the reconciler itself is broken or missing: it stops every managed engine
# unit directly and clears the markers so nothing comes back on the next boot.
#
#   ./sparky.sh teardown            # activate empty (preferred; no sudo)
#   ansible-playbook teardown.yml   # break-glass, as deploy
#   ansible-playbook teardown.yml --tags webui   # also stop Open WebUI + Caddy

- name: Stop every vLLM engine (all nodes)
  hosts: all
  tasks:
    - name: Find the active-marker set
      ansible.builtin.find:
        paths: "{{ vllm_active_dir }}"
        file_type: file
      register: active_markers
      failed_when: false

    # Markers first, units second — the same order the reconciler uses, so an
    # interrupted teardown still converges to "nothing desired" rather than
    # resurrecting an engine at the next boot.
    - name: Clear every desired marker
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ active_markers.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Stop each engine instance
      ansible.builtin.systemd:
        name: "vllm@{{ item.path | basename }}.service"
        state: stopped
      loop: "{{ active_markers.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      failed_when: false

    # Catch anything running that had no marker (e.g. a hand-started unit) plus the
    # pre-ADR-0018 per-engine units, then drop their containers. Strict namespace.
    - name: Stop any remaining vLLM units
      ansible.builtin.shell: >-
        systemctl list-units --type=service --all --plain --no-legend 'vllm@*.service' 'vllm-*.service'
        | awk '{print $1}' | xargs -r systemctl stop
      changed_when: false
      failed_when: false

    - name: Remove any remaining vLLM containers
      ansible.builtin.shell: >-
        docker ps -aq --filter 'name=^vllm-' | xargs -r docker rm -f
      changed_when: false
      failed_when: false

- name: Record that nothing is selected (sparky)
  hosts: head
  tasks:
    - name: Set the activation request to 'empty'
      ansible.builtin.copy:
        content: "empty\n"
        dest: "{{ desired_profile_file }}"
        owner: "{{ activate_user }}"
        group: "{{ activate_group }}"
        mode: "0664"

    - name: Overwrite current-topology.json with an empty topology
      ansible.builtin.copy:
        content: "{{ {'profile': 'empty', 'activated_at': ansible_date_time.iso8601, 'deployed_at': ansible_date_time.iso8601, 'engines': []} | to_nice_json }}\n"
        dest: "{{ cluster_topology_file }}"
        owner: deploy
        group: cluster
        mode: "0644"

    - name: Clear the gate breadcrumb (stale once nothing is serving)
      ansible.builtin.file:
        path: "{{ cluster_smoke_report }}"
        state: absent

- name: Stop front-end — Open WebUI + Caddy (only with --tags webui)
  hosts: head
  tags: [never, webui]
  tasks:
    - name: Compose down Open WebUI
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ webui_install_dir }}"
      changed_when: true
      failed_when: false

    - name: Compose down Caddy
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ caddy_dir }}"
      changed_when: true
      failed_when: false
