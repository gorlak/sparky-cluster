[project]
name = "sparky"
version = "0.1.0"
description = "Test/bench harness and cluster-control tooling for Sparky Cluster (ADR-0010)."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
sparky = "sparky.cli:app"

[dependency-groups]
# fastapi/starlette are PINNED to the exact versions the control panel deploys
# (roles/control-panel/files/app/requirements.txt). tests/test_control_panel.py loads
# the panel's main.py under THIS environment, so a floor here means the panel is tested
# against a FastAPI it will never run — and DEF-0005 is a standing reminder that a
# FastAPI minor can break a working app outright. tests/test_roles.py asserts they match.
dev = [
    "pytest>=8",
    "jinja2>=3",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
markers = [
    "real_lock_paths: reads the REAL /opt/cluster lock constants (see tests/conftest.py)",
]
filterwarnings = [
    # starlette's TestClient nudges toward a future httpx2; harmless, hide the noise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparky"]
