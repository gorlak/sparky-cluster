[project]
name = "sparky"
version = "0.1.0"
description = "Test/bench harness and cluster-control tooling for Sparky Cluster (ADR-0010)."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
sparky = "sparky.cli:app"

[dependency-groups]
dev = ["pytest>=8", "jinja2>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparky"]
