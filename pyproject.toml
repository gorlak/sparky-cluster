[project]
name = "sparky"
version = "0.1.0"
description = "Test/bench harness and cluster-control tooling for Sparky Cluster (ADR-0010)."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
sparky = "sparky.cli:app"

[dependency-groups]
dev = ["pytest>=8", "jinja2>=3", "fastapi>=0.110", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
filterwarnings = [
    # starlette's TestClient nudges toward a future httpx2; harmless, hide the noise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparky"]
